/* Selecting and nudging a point without a mouse. Every one of the shortcuts
   below used to act on a selection that only a click could make, which made
   them unreachable in a keyboard-only session. */
function selectVertex(step){
  const a=active();
  if(!a||!a.pts.length) return false;
  const n=a.pts.length;
  let i = (selVert&&selVert.pathId===a.id) ? selVert.i+step : (step>0?0:n-1);
  if(i<0) i=n-1; if(i>=n) i=0;
  selVert={pathId:a.id,i:i};
  map.panInside(L.latLng(a.pts[i]),{padding:[60,60]});
  render();
  announce(a.name+' point '+(i+1)+' of '+n);
  return true;
}
/* one step is roughly one screen pixel, so nudging feels the same at any zoom */
function nudgeVertex(dx,dy,big){
  const a=active();
  if(!a||!selVert||selVert.pathId!==a.id) return false;
  const k=big?10:1;
  const pt=map.latLngToContainerPoint(L.latLng(a.pts[selVert.i]));
  const ll=map.containerPointToLatLng(L.point(pt.x+dx*k,pt.y+dy*k));
  save();
  a.pts[selVert.i]={lat:ll.lat,lng:ll.lng};   /* moves only the selected point */
  stamp(a); touch();
  announce('Moved to '+fmt(pathLen(a)).join(' '));
  return true;
}
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA') return;
  const inList=e.target.getAttribute&&e.target.getAttribute('role')==='option';
  if((e.key==='z'||e.key==='Z')&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if((e.key==='y'||e.key==='Y')&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); redo(); return; }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if((e.key==='Delete'||e.key==='Backspace')&&mode==='route'&&selVia){ e.preventDefault(); document.getElementById('del-via').click(); return; }
  if((e.key==='Delete'||e.key==='Backspace')&&selVert&&!inList){ e.preventDefault(); document.getElementById('del-pt').click(); return; }
  if(e.key==='Escape'){ selVert=null; pickNext=null; selVia=null; render(); if(mode==='route'){ drawCands(); candPanel(); } return; }
  if((e.key==='z'||e.key==='Z')){ undo(); return; }
  if(inList) return;                         /* the list owns its own arrow keys */
  if(mode!=='route'){
    if(e.key==='Tab'&&!e.shiftKey&&selectVertexIntent(e)) return;
    if(e.key===']'||e.key==='.'){ e.preventDefault(); selectVertex(1); return; }
    if(e.key==='['||e.key===','){ e.preventDefault(); selectVertex(-1); return; }
    if(selVert){
      const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
      if(d){ e.preventDefault(); nudgeVertex(d[0],d[1],e.shiftKey); return; }
    }
  }
});
/* Tab into the point sequence only when the map itself holds focus, so tabbing
   through the panel is not hijacked */
function selectVertexIntent(e){
  if(document.activeElement!==map.getContainer()) return false;
  e.preventDefault();
  return selectVertex(1);
}

/* ------------------------------ OSM import ------------------------------ */
const BIKE='cycleway|footway|path|track|pedestrian|steps|bridleway|living_street';
const ROAD=BIKE+'|residential|service|unclassified|tertiary|secondary|primary|trunk';

/* The public Overpass instances are free, shared and shed load with 504s under
   pressure — one endpoint hit once will fail a good fraction of the time. Walk
   the mirrors, then come back round for a second pass, and report what actually
   went wrong rather than a blanket "could not reach". */
/* Independent instances on independent networks. Measured from a real browser,
   these fail in completely different ways at the same moment — one host
   refusing outright (a rate-limited 429 arrives with no CORS headers, so the
   browser can only report an opaque "failed to fetch") while another answers in
   under half a second. Breadth across operators is what makes this reliable.

   WORLDWIDE INSTANCES ONLY. Regional mirrors (overpass.osm.ch is Switzerland,
   overpass.osm.jp is Japan) answer 200 with zero ways outside their extract,
   which reads as "there is nothing here" when the truth is "wrong server". */
const OVERPASS=[
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://lz4.overpass-api.de/api/interpreter',
  'https://overpass.private.coffee/api/interpreter',
  'https://z.overpass-api.de/api/interpreter'
];
/* short, because a hung endpoint costs the full timeout before the next one is
   tried — rotating quickly beats waiting politely */
const OVERPASS_TIMEOUT_MS=10000;
const LAST_GOOD='traceroute.overpass.lastGood';
function overpassOrder(){
  let good=null;
  try{ good=localStorage.getItem(LAST_GOOD); }catch(e){}
  if(!good||OVERPASS.indexOf(good)<0) return OVERPASS.slice();
  /* whatever worked last time on this network goes first */
  return [good].concat(OVERPASS.filter(u=>u!==good));
}
/* one shared abort handle, so the busy chip's Cancel can stop a fetch that is
   already in flight rather than leaving the user watching a counter */
let netAbort=null, netCancelled=false;
/* Cancel means cancel: it stops the request in flight, and every later stage —
   the mirror rotation, the direct OSM API, the tile loop — checks this before
   starting, so pressing it once does not just hand off to the next attempt. */
function cancelNetwork(){
  netCancelled=true;
  if(netAbort){ try{ netAbort.abort(); }catch(e){} }
  busyStop();
  toast('Stopped — nothing was loaded');
}
function overpass(q,onTry){
  let last='no endpoint answered', sawEmpty=null;
  const order=overpassOrder();
  function attempt(i){
    if(netCancelled) return Promise.reject(new Error('cancelled'));
    /* every endpoint said "nothing here" — believe it only once they all agree */
    if(i>=order.length*2) return sawEmpty ? Promise.resolve(sawEmpty) : Promise.reject(new Error(last));
    const url=order[i%order.length];
    if(onTry) onTry(i+1,order.length*2);
    const ctl=('AbortController' in self)?new AbortController():null;
    netAbort=ctl;
    const timer=setTimeout(function(){ if(ctl) ctl.abort(); },OVERPASS_TIMEOUT_MS);
    return fetch(url,{method:'POST',body:q,signal:ctl?ctl.signal:undefined})
      .then(function(res){
        if(res.status===429||res.status===504||res.status===503){ throw new Error('busy ('+res.status+')'); }
        if(!res.ok) throw new Error('HTTP '+res.status);
        return res.json().then(function(j){
          /* a 200 with no ways is not proof the area is empty — it is also what
             a regional instance says about the rest of the world. Keep it, but
             ask the other endpoints before reporting it. */
          if(!j||!j.elements||!j.elements.length){ sawEmpty=j||{elements:[]}; last='no data from that endpoint'; return null; }
          try{ localStorage.setItem(LAST_GOOD,url); }catch(e){}
          return j;
        });
      })
      .catch(function(err){
        last = err && err.name==='AbortError' ? 'timed out' : (err.message||'network error');
        return null;
      })
      .then(function(data){
        clearTimeout(timer);
        if(data) return data;
        /* brief backoff once every endpoint has been tried once */
        const wait = i>=order.length-1 ? 1200 : 0;
        return new Promise(r=>setTimeout(r,wait)).then(function(){ return attempt(i+1); });
      });
  }
  return attempt(0);
}

/* Last resort when every Overpass instance refuses: the main OSM API. It is a
   different host on different infrastructure, so it tends to be reachable when
   the Overpass mirrors are not. It is meant for editing rather than bulk
   queries, so it is used only after Overpass has failed and only for a small
   box — never for the "load the whole viewport" buttons on a wide view. */
const OSM_API='https://api.openstreetmap.org/api/0.6/map';
const OSM_API_TILE_DEG=0.02;     /* one request's worth — a few MB of XML */
const OSM_API_MAX_TILES=8;       /* refuse to grind the editing API for a whole city */
/* If the wanted area needs more tiles than that, pull in the sides rather than
   give up — a narrower corridor around the route still beats no network at all. */
function shrinkForOsmApi(bbox){
  let b=bbox.slice();
  for(let i=0;i<12 && osmApiTiles(b).length>OSM_API_MAX_TILES;i++){
    const cLat=(b[0]+b[2])/2, cLng=(b[1]+b[3])/2, k=0.8;
    b=[cLat+(b[0]-cLat)*k, cLng+(b[1]-cLng)*k, cLat+(b[2]-cLat)*k, cLng+(b[3]-cLng)*k];
  }
  return b;
}
function osmApiTiles(bbox){
  const g=OSM_API_TILE_DEG, out=[];
  for(let s=Math.floor(bbox[0]/g)*g; s<bbox[2]-1e-9; s+=g)
    for(let w=Math.floor(bbox[1]/g)*g; w<bbox[3]-1e-9; w+=g)
      out.push([+s.toFixed(6),+w.toFixed(6),+(s+g).toFixed(6),+(w+g).toFixed(6)]);
  return out;
}
function osmApiTile(box,filter,seen,out){
  if(netCancelled) return Promise.reject(new Error('cancelled'));
  const url=OSM_API+'?bbox='+[box[1],box[0],box[3],box[2]].map(v=>v.toFixed(6)).join(',');
  const ctl=('AbortController' in self)?new AbortController():null;
  netAbort=ctl;
  const timer=setTimeout(function(){ if(ctl) ctl.abort(); },OVERPASS_TIMEOUT_MS*3);
  return fetch(url,{signal:ctl?ctl.signal:undefined})
    .then(function(res){ if(!res.ok) throw new Error('OSM API '+res.status); return res.text(); })
    .then(function(xml){
      clearTimeout(timer);
      const doc=new DOMParser().parseFromString(xml,'application/xml');
      if(doc.querySelector('parsererror')) throw new Error('bad XML from the OSM API');
      const at=new Map();
      doc.querySelectorAll('node').forEach(function(n){
        at.set(n.getAttribute('id'),{lat:+n.getAttribute('lat'),lng:+n.getAttribute('lon')});
      });
      const re=new RegExp('^('+filter+')$');
      doc.querySelectorAll('way').forEach(function(w){
        const id=w.getAttribute('id');
        if(seen.has(id)) return;                 /* ways straddle tile edges */
        let hw=null,name=null;
        w.querySelectorAll('tag').forEach(function(t){
          const k=t.getAttribute('k');
          if(k==='highway') hw=t.getAttribute('v');
          else if(k==='name') name=t.getAttribute('v');
        });
        if(!hw||!re.test(hw)) return;
        const pts=[];
        w.querySelectorAll('nd').forEach(function(nd){
          const p=at.get(nd.getAttribute('ref')); if(p) pts.push(p);
        });
        if(pts.length>1){ seen.add(id); out.push({name:name||hw,pts:pts}); }
      });
    })
    .catch(function(err){ clearTimeout(timer); throw err; });
}
/* The editing API caps how much one request may return, so a box wider than a
   tile is fetched as a few tiles and stitched. Sequential on purpose: this is a
   fallback for when Overpass is down, not a bulk download service. */
function osmApiWays(filter,bbox,onTile){
  const tiles=osmApiTiles(bbox);
  if(tiles.length>OSM_API_MAX_TILES)
    return Promise.reject(new Error('area too large for the OSM API'));
  const seen=new Set(), out=[];
  let ok=0;
  return tiles.reduce(function(chain,box,i){
    return chain.then(function(){
      if(netCancelled) return;
      if(onTile) onTile(i+1,tiles.length);
      return osmApiTile(box,filter,seen,out).then(function(){ ok++; },function(){ /* skip a bad tile */ });
    });
  },Promise.resolve()).then(function(){
    if(netCancelled) throw new Error('cancelled');
    if(!ok) throw new Error('the OSM API did not answer either');
    return out;
  });
}

/* Requests are snapped outward onto a fixed grid before they are fetched or
   cached. Without this, a box a few metres wider than the cached one misses the
   cache completely and goes back to the network for data already on the device;
   with it, every request in a neighbourhood produces the same key. */
const NET_GRID_DEG=0.01;                 /* ~1.1 km of latitude */
function gridBbox(b){
  const g=NET_GRID_DEG, r=v=>+v.toFixed(6);
  return [r(Math.floor(b[0]/g)*g), r(Math.floor(b[1]/g)*g),
          r(Math.ceil (b[2]/g)*g), r(Math.ceil (b[3]/g)*g)];
}

/* padded bounding box around a set of points, in metres */
function bboxAround(pts,padM){
  let s=90,w=180,n=-90,e=-180;
  pts.forEach(function(p){ s=Math.min(s,p.lat); n=Math.max(n,p.lat); w=Math.min(w,p.lng); e=Math.max(e,p.lng); });
  const dLat=padM/111320, dLng=padM/(111320*Math.max(kx,.05));
  return [s-dLat,w-dLng,n+dLat,e+dLng];
}
function bboxSpanM(b){ return hav({lat:b[0],lng:b[1]},{lat:b[2],lng:b[3]}); }

/* install a set of ways as the imported layer, replacing any previous import
   and leaving every drawn path untouched */
function applyWays(ways){
  save();
  paths=paths.filter(p=>p.source!=='osm');
  ways.forEach(function(w){
    paths.push({id:++seq, uid:uuid(), updatedAt:Date.now(), name:w.name||'way',
      /* imported geometry is read-only and never edited */
      pts:w.pts.map(g=>({lat:g.lat,lng:g.lng})),
      color:'#4E7A8F', source:'osm'});
  });
  touch();
}
function importOSM(filter,label,bbox,opts){
  if(!bbox){
    if(map.getZoom()<13){ toast('Zoom in a little before loading'); return Promise.resolve(0); }
    const b=map.getBounds();
    bbox=[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()];
  }
  bbox=gridBbox(bbox);
  const fresh=!!(opts&&opts.fresh);
  const useCache=function(hit,note){
    applyWays(hit.ways);
    const age=Math.round((Date.now()-hit.savedAt)/86400000);
    toast(hit.ways.length+' '+label+' from this device'+(note?' ('+note+')':'')+
          (age>0?' · saved '+age+'d ago':''));
    return hit.ways.length;
  };
  const fromNetwork=function(){
    const q='[out:json][timeout:25];way["highway"~"^('+filter+')$"]('+
      bbox.map(v=>v.toFixed(6)).join(',')+');out geom;';
    /* elapsed seconds, not a retry index — "4/10" counting backwards to "1/8"
       under a new label is not progress, it is bookkeeping shown by mistake */
    netCancelled=false;
    busyStart('Loading the street network');
    return overpass(q,function(){ })
      .then(function(data){
        const ways=(data.elements||[]).filter(w=>w.geometry&&w.geometry.length>1).slice(0,3000)
          .map(function(w){
            return {name:(w.tags&&(w.tags.name||w.tags.highway))||'way',
                    pts:w.geometry.map(g=>({lat:g.lat,lng:g.lon}))};
          });
        if(!ways.length){ toast('No '+label+' found here'); return 0; }
        applyWays(ways);
        netCachePut(filter,bbox,ways);
        toast('Loaded '+ways.length+' '+label);
        return ways.length;
      })
      .catch(function(err){
        if(netCancelled) return 0;
        /* every Overpass instance refused — try the main OSM API, then fall
           back to whatever copy of this area is already on the device */
        busyStart('Asking OpenStreetMap directly');
        /* cache under the box actually fetched, never the one asked for, or a
           later request would think it already had the wider area */
        const small=shrinkForOsmApi(bbox);
        return osmApiWays(filter,small,function(){
        }).then(function(ways){
          if(!ways.length) throw new Error('no ways');
          applyWays(ways);
          netCachePut(filter,small,ways);
          toast('Loaded '+ways.length+' '+label+' from OpenStreetMap directly');
          return ways.length;
        }).catch(function(){
          if(netCancelled) return 0;
          return netCacheGet(filter,bbox).then(function(hit){
            if(hit&&hit.ways.length) return useCache(hit,'OpenStreetMap is not answering');
            toast('OpenStreetMap did not answer ('+(err.message||'unknown')+') — try again shortly');
            return 0;
          });
        });
      })
      .then(function(n){ busyStop(); return n; });
  };
  if(fresh) return fromNetwork();
  return netCacheGet(filter,bbox).then(function(hit){
    if(hit&&hit.ways.length) return useCache(hit,null);
    return fromNetwork();
  });
}
document.getElementById('imp-bike').onclick=function(){ importOSM(BIKE,'bike & foot paths',null,{fresh:true}); };
document.getElementById('imp-road').onclick=function(){ importOSM(ROAD,'roads and paths',null,{fresh:true}); };

/* --------------------- routing on a bare map (no drawing) ---------------------
   Routing consumes the derived graph, and the graph does not care whether a
   path was drawn or imported. So "route A to B without drawing anything" is
   just: make sure a network exists around A and B, then solve as usual. */
const AUTO_NET_NEAR_M=60;       /* an endpoint this close to a line needs nothing loaded */
/* Slack around the A–B box. A real route rarely runs straight down the corridor
   between its endpoints, and anything outside the fetched box simply cannot be
   found, so the padding scales with how far apart the endpoints are. */
const AUTO_NET_PAD_MIN_M=350, AUTO_NET_PAD_FRAC=0.3, AUTO_NET_PAD_MAX_M=1500;
const AUTO_NET_MAX_SPAN_M=15000;
function autoNetPad(){
  return Math.min(AUTO_NET_PAD_MAX_M, Math.max(AUTO_NET_PAD_MIN_M, hav(A,B)*AUTO_NET_PAD_FRAC));
}
let netBusy=false, netTriedKey='', userPlaced=false;
function endpointKey(){
  return (A&&B) ? [A.lat,A.lng,B.lat,B.lng].map(v=>v.toFixed(5)).join(',') : '';
}
function maybeAutoNetwork(){
  /* only ever in response to the user placing an endpoint. Restoring a saved
     A and B on page load must not greet them with a request to fetch a city. */
  if(!userPlaced) return false;
  if(!A||!B||netBusy) return false;
  const key=endpointKey();
  if(netTriedKey===key) return false;
  /* already something routable at both ends — the user's own paths count */
  if(paths.length && nearestVertex(A,AUTO_NET_NEAR_M) && nearestVertex(B,AUTO_NET_NEAR_M)) return false;
  const bbox=bboxAround([A,B],autoNetPad());
  if(bboxSpanM(bbox)>AUTO_NET_MAX_SPAN_M){
    toast('Start and finish are far apart — load the network yourself with Load all roads');
    netTriedKey=key;
    return false;
  }
  /* Ask first. This pulls thousands of ways over a shared free service and
     repaints them across the map you are tracing on; doing that silently on a
     second click is not a decision the app gets to make. */
  const km2=(hav({lat:bbox[0],lng:bbox[1]},{lat:bbox[2],lng:bbox[1]})/1000)*
            (hav({lat:bbox[0],lng:bbox[1]},{lat:bbox[0],lng:bbox[3]})/1000);
  netTriedKey=key;
  askNetwork(km2.toFixed(1),function(){
    netBusy=true;
    importOSM(ROAD,'roads and paths',bbox)
    .then(function(n){
      netBusy=false;
      if(n){ solveAll(); return; }
      /* let the next attempt try again rather than latching the failure, but do
         not re-solve here — that would spin on a dead endpoint */
      netTriedKey='';
      cands.forEach(function(c){ c.err='network not loaded'; });
      candPanel(); strip();
    })
    .catch(function(){ netBusy=false; netTriedKey=''; });
  },function(){
    /* declined — say what to do instead, and leave the candidates honest */
    cands.forEach(function(c){ c.err='no network loaded'; });
    candPanel(); strip();
    toast('Left as it is — draw your own paths, or load a network from the panel');
  });
  return true;
}

/* An inline consent bar rather than a modal: it interrupts nothing, and the map
   stays visible behind the decision it is about. */
function askNetwork(km2,onYes,onNo){
  const el=document.getElementById('ask');
  el.innerHTML='<p>Load the street network between your two points?<br>'+
    '<span>About '+km2+' km² from OpenStreetMap, a few thousand ways drawn under your paths.</span></p>'+
    '<div><button type="button" id="ask-no" class="ghost">Not now</button>'+
    '<button type="button" id="ask-yes">Load it</button></div>';
  el.classList.add('show');
  const close=function(){ el.classList.remove('show'); el.innerHTML=''; };
  document.getElementById('ask-yes').onclick=function(){ close(); onYes(); };
  document.getElementById('ask-no').onclick=function(){ close(); if(onNo) onNo(); };
  document.getElementById('ask-yes').focus();
}

/* -------------------------------- save/load -------------------------------- */
document.getElementById('save').onclick=function(){
  const feats=paths.filter(p=>p.pts.length>1).map(function(p){
    return {type:'Feature',
      properties:{name:p.name,color:p.color,source:p.source,length_m:+pathLen(p).toFixed(1)},
      geometry:{type:'LineString',coordinates:p.pts.map(x=>[x.lng,x.lat])}};
  });
  if(!feats.length){ toast('Nothing to save yet'); return; }
  const url=URL.createObjectURL(new Blob([JSON.stringify({type:'FeatureCollection',features:feats})],{type:'application/json'}));
  const a=document.createElement('a'); a.href=url; a.download='paths.geojson'; a.click();
  URL.revokeObjectURL(url);
};
document.getElementById('gpx').onclick=function(){
  const ps=paths.filter(p=>p.source!=='osm'&&p.pts.length>1);
  if(!ps.length){ toast('Nothing to export yet'); return; }
  const esc=s=>escapeHtml(s);
  const body=ps.map(function(p){
    return '<trk><name>'+esc(p.name)+'</name><trkseg>'+
      p.pts.map(x=>'<trkpt lat="'+x.lat.toFixed(7)+'" lon="'+x.lng.toFixed(7)+'"/>').join('')+
      '</trkseg></trk>';
  }).join('');
  const gpx='<?xml version="1.0" encoding="UTF-8"?>\n'+
    '<gpx version="1.1" creator="Trace &amp; Route" xmlns="http://www.topografix.com/GPX/1/1">'+
    body+'</gpx>';
  const url=URL.createObjectURL(new Blob([gpx],{type:'application/gpx+xml'}));
  const a=document.createElement('a'); a.href=url; a.download='paths.gpx'; a.click();
  URL.revokeObjectURL(url);
};
document.getElementById('load').onclick=function(){ document.getElementById('file').click(); };

/* GPX in as well as out — a track recorded on a watch is points in order, which
   is exactly the model here, so they are taken verbatim like any other file */
function linesFromGPX(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.querySelector('parsererror')) throw new Error('bad XML');
  const out=[];
  doc.querySelectorAll('trk').forEach(function(trk){
    const nm=trk.querySelector('name'), name=nm?nm.textContent:null;
    trk.querySelectorAll('trkseg').forEach(function(seg){
      const pts=[];
      seg.querySelectorAll('trkpt').forEach(function(p){
        pts.push({lat:+p.getAttribute('lat'),lng:+p.getAttribute('lon')});
      });
      if(pts.length>1) out.push({name:name,pts:pts});
    });
  });
  doc.querySelectorAll('rte').forEach(function(rte){
    const nm=rte.querySelector('name'), pts=[];
    rte.querySelectorAll('rtept').forEach(function(p){
      pts.push({lat:+p.getAttribute('lat'),lng:+p.getAttribute('lon')});
    });
    if(pts.length>1) out.push({name:nm?nm.textContent:null,pts:pts});
  });
  return out;
}
function linesFromGeoJSON(text){
  const g=JSON.parse(text);
  const feats=g.type==='FeatureCollection'?g.features:[g];
  const out=[];
  feats.forEach(function(ft){
    const geo=ft.geometry||ft, pr=ft.properties||{};
    const lines = geo.type==='LineString'?[geo.coordinates]:(geo.type==='MultiLineString'?geo.coordinates:[]);
    lines.forEach(function(c){
      out.push({name:pr.name||null, color:pr.color||null, source:pr.source,
                pts:c.map(p=>({lat:p[1],lng:p[0]}))});
    });
  });
  return out;
}
document.getElementById('file').onchange=function(e){
  const f=e.target.files[0]; if(!f) return;
  const isGpx=/\.gpx$/i.test(f.name);
  const r=new FileReader();
  r.onload=function(){
    let lines;
    try{ lines = isGpx ? linesFromGPX(r.result) : linesFromGeoJSON(r.result); }
    catch(err){ toast('That file is not valid '+(isGpx?'GPX':'GeoJSON')); return; }
    if(!lines.length){ toast('No lines found in that file'); return; }
    save();
    lines.forEach(function(ln,i){
      paths.push({id:++seq, uid:uuid(), updatedAt:Date.now(),
        name:ln.name||('Path '+(i+1)),
        /* coordinates are taken verbatim from the file */
        pts:ln.pts,
        color:ln.color||PALETTE[colorSeq++%PALETTE.length],
        source:ln.source==='osm'?'osm':'drawn'});
    });
    const last=paths.filter(p=>p.source!=='osm').slice(-1)[0];
    activeId=last?last.id:null;
    const bb=L.latLngBounds([].concat.apply([],paths.map(p=>p.pts)));
    if(bb.isValid()) map.fitBounds(bb,{padding:[50,50]});
    touch(); toast('Loaded '+lines.length+' path'+(lines.length===1?'':'s'));
  };
  r.readAsText(f); e.target.value='';
};

/* Viewport actions belong on the map, not in a settings column: they act on the
   map, and they are reachable there without opening the panel on a phone. */

/* Opens on Reykjavík, which is wrong for anyone standing anywhere else. Behind
   a button, so nothing asks for your location just because the page loaded. */
document.getElementById('locate').onclick=function(){
  if(!navigator.geolocation){ toast('This browser will not share a location'); return; }
  toast('Asking your browser where you are…');
  navigator.geolocation.getCurrentPosition(function(pos){
    map.setView([pos.coords.latitude,pos.coords.longitude],18);
    toast('Centred on you — accurate to about '+Math.round(pos.coords.accuracy)+' m');
  },function(err){
    toast(err.code===1?'Location permission refused':'Could not get a location fix');
  },{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
};
document.getElementById('fit').onclick=function(){
  const pts=[].concat.apply([],paths.filter(p=>p.source!=='osm').map(p=>p.pts));
  if(!pts.length){ toast('No paths to fit to yet'); return; }
  const bb=L.latLngBounds(pts);
  if(bb.isValid()) map.fitBounds(bb,{padding:[50,50]});

/* --------------------------------- misc --------------------------------- */
let tt;
function toast(m){
  const t=document.getElementById('toast');
  t.textContent=m; t.classList.add('show');
  clearTimeout(tt); tt=setTimeout(function(){ t.classList.remove('show'); },2400);
}

/* ---------------------------- busy indicator ----------------------------
   Counts the seconds it has actually been waiting and offers a way out. A
   minimum on-screen time stops a cache hit strobing the chip for one frame. */
const BUSY_MIN_MS=350;
let busyT=null, busyShownAt=0;
function busyStart(label){
  const el=document.getElementById('busy');
  busyShownAt=Date.now();
  el.innerHTML='<span id="busy-label"></span><button type="button" class="busy-x" id="busy-cancel">Cancel</button>';
  document.getElementById('busy-cancel').onclick=function(){
    cancelNetwork();
    document.getElementById('busy-label').textContent='Stopping…';
  };
  const tick=function(){
    const s=Math.round((Date.now()-busyShownAt)/1000);
    const lab=document.getElementById('busy-label');
    if(lab) lab.textContent=label+' · '+s+'s';
  };
  tick();
  clearInterval(busyT); busyT=setInterval(tick,1000);
  el.classList.add('show');
}
function busyStop(){
  clearInterval(busyT); busyT=null;
  const el=document.getElementById('busy');
  const wait=Math.max(0,BUSY_MIN_MS-(Date.now()-busyShownAt));
  setTimeout(function(){ el.classList.remove('show'); },wait);
}
map.on('moveend',function(){ kx=Math.cos(rad(map.getCenter().lat)); });

/* ------------------------------ persistence ------------------------------ */
/* Autosave of everything the user made: paths, candidates, A/B, modes, view.
   Records carry a stable uid and updatedAt so a future sync or merge has
   something to hold on to. Point arrays are stored verbatim. */
const DB='trace-route', STORE='state', NET='net', KEY='current', SCHEMA=1;
function withDB(fn){
  return new Promise(function(res,rej){
    if(!self.indexedDB){ rej(new Error('no indexeddb')); return; }
    const r=indexedDB.open(DB,2);
    r.onupgradeneeded=function(){
      const db=r.result;
      if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      if(!db.objectStoreNames.contains(NET)) db.createObjectStore(NET);
    };
    r.onsuccess=function(){ fn(r.result,res,rej); };
    r.onerror=function(){ rej(r.error); };
  });
}
function dbPut(v,store,key){
  return withDB(function(db,res,rej){
    const s=store||STORE, tx=db.transaction(s,'readwrite');
    tx.objectStore(s).put(v,key||KEY);
    tx.oncomplete=function(){ db.close(); res(); };
    tx.onerror=function(){ db.close(); rej(tx.error); };
  });
}
function dbGet(store,key){
  return withDB(function(db,res,rej){
    const s=store||STORE, tx=db.transaction(s,'readonly');
    const q=tx.objectStore(s).get(key||KEY);
    q.onsuccess=function(){ db.close(); res(q.result||null); };
    q.onerror=function(){ db.close(); rej(q.error); };
  });
}
function dbWipe(){
  return withDB(function(db,res,rej){
    const tx=db.transaction([STORE,NET],'readwrite');
    tx.objectStore(STORE).delete(KEY);
    tx.objectStore(NET).clear();
    tx.oncomplete=function(){ db.close(); res(); };
    tx.onerror=function(){ db.close(); rej(tx.error); };
  });
}

/* ---------------------------- network cache ----------------------------
   Overpass is a free shared service that is regularly slow or down. Once an
   area has been fetched it is kept locally, so routing the same neighbourhood
   tomorrow needs no network at all. Cached geometry is imported OSM data, and
   stays as read-only as any other import. */
const NET_CACHE_KEY='areas', NET_CACHE_MAX=8;
function netCacheGet(filter,bbox){
  return dbGet(NET,NET_CACHE_KEY).then(function(list){
    if(!list||!list.length) return null;
    /* any cached area that fully contains what is being asked for will do */
    const hit=list.filter(function(e){
      return e.filter===filter &&
        e.bbox[0]<=bbox[0]+1e-9 && e.bbox[1]<=bbox[1]+1e-9 &&
        e.bbox[2]>=bbox[2]-1e-9 && e.bbox[3]>=bbox[3]-1e-9;
    }).sort(function(a,b){ return b.savedAt-a.savedAt; })[0];
    return hit||null;
  }).catch(function(){ return null; });
}
function netCachePut(filter,bbox,ways){
  return dbGet(NET,NET_CACHE_KEY).then(function(list){
    list=(list||[]).filter(function(e){
      /* drop anything the new, larger area already covers */
      return !(e.filter===filter &&
        bbox[0]<=e.bbox[0] && bbox[1]<=e.bbox[1] && bbox[2]>=e.bbox[2] && bbox[3]>=e.bbox[3]);
    });
    list.push({filter:filter,bbox:bbox,ways:ways,savedAt:Date.now()});
    list.sort(function(a,b){ return b.savedAt-a.savedAt; });
    return dbPut(list.slice(0,NET_CACHE_MAX),NET,NET_CACHE_KEY);
  }).catch(function(){ /* cache is an optimisation, never a hard failure */ });
}

let ready=false, saveT=null;
function snapshot(){
  const ctr=map.getCenter();
  return {
    schema:SCHEMA, savedAt:Date.now(),
    paths:paths.map(function(p){
      return {uid:p.uid||uuid(), updatedAt:p.updatedAt||Date.now(), name:p.name,
              color:p.color, source:p.source,
              pts:p.pts.map(x=>({lat:x.lat,lng:x.lng}))};
    }),
    cands:cands.map(function(c){
      return {uid:c.uid||uuid(), updatedAt:c.updatedAt||Date.now(), name:c.name,
              color:c.color, vias:c.vias.map(v=>({lat:v.lat,lng:v.lng}))};
    }),
    A:A, B:B,
    activeUid:(byId(activeId)||{}).uid||null,
    activeCandUid:(cands.find(c=>c.id===activeCand)||{}).uid||null,
    mode:mode, inputMode:inputMode, appendTo:appendTo,
    precision:precision, snap:+snapEl.value,
    base:document.getElementById('base').value,
    view:{lat:ctr.lat,lng:ctr.lng,z:map.getZoom()}
  };
}
function persist(){
  if(!ready) return;
  clearTimeout(saveT);
  saveT=setTimeout(function(){
    dbPut(snapshot()).catch(function(){ /* private mode / quota — stay usable */ });
  },400);
}
function applyState(st){
  if(!st||st.schema!==SCHEMA) return;
  paths=(st.paths||[]).map(function(p){
    return {id:++seq, uid:p.uid||uuid(), updatedAt:p.updatedAt||Date.now(),
            name:p.name||'Path', color:p.color||PALETTE[colorSeq++%PALETTE.length],
            source:p.source==='osm'?'osm':'drawn',
            pts:(p.pts||[]).map(x=>({lat:x.lat,lng:x.lng}))};
  });
  colorSeq=paths.length;
  const av=paths.find(p=>p.uid===st.activeUid);
  activeId = av ? av.id : (paths.filter(p=>p.source!=='osm').slice(-1)[0]||{}).id||null;

  A=st.A||null; B=st.B||null;
  cands=(st.cands||[]).map(function(c){
    return {id:++candSeq, uid:c.uid||uuid(), updatedAt:c.updatedAt||Date.now(),
            name:c.name||'Option', color:c.color||CPAL[(candSeq-1)%CPAL.length],
            vias:(c.vias||[]).map(v=>({lat:v.lat,lng:v.lng})),
            legs:[], len:null, err:null};
  });
  const ac=cands.find(c=>c.uid===st.activeCandUid);
  activeCand = ac ? ac.id : (cands.length?cands[cands.length-1].id:null);

  if(st.snap) snapEl.value=st.snap;
  document.getElementById('snap-out').textContent=snapEl.value+' m';
  if(st.base&&BASES[st.base]){ document.getElementById('base').value=st.base; setBase(st.base); }
  if(st.view) map.setView([st.view.lat,st.view.lng],st.view.z);
  if(st.appendTo==='start') document.getElementById('end-start').click();
  dirty=vDirty=true;
}
document.getElementById('wipe').onclick=function(){
  /* the only action in the app that undo cannot reach, so it asks */
  if(!confirm('Erase the saved copy on this device?\n\nYour paths, options and cached street network will be gone when you next open the app. What is on screen now stays until you reload.')) return;
  dbWipe().then(function(){ toast('Saved copy erased — this page keeps what is on screen'); })
          .catch(function(){ toast('Nothing saved to erase'); });
};

/* --------------------------------- boot --------------------------------- */
function boot(st){
  if(st){ try{ applyState(st); }catch(e){ /* corrupt save must not brick the app */ } }
  ready=true;
  setInput(st&&st.inputMode==='free'?'free':'click');
  setPrecision(!!(st&&st.precision));
  setMode(st&&/^(add|edit|route)$/.test(st.mode)?st.mode:'add');
  if(A&&B) solveAll(); else clearRoute();
  render();
  if(st&&paths.length) toast('Restored '+paths.length+' path'+(paths.length===1?'':'s'));
}
dbGet().then(boot,function(){ boot(null); });
})();
