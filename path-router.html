<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- pinch-zoom stays enabled: the panel's smallest type is 9-11px mono and
     magnifying it is the user's own remedy (WCAG 1.4.4) -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace &amp; Route</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --ink:#0B171D; --ink-2:#12242D; --ice:#E4EFF3; --slate:#5C7A88; --line:#1E3A47;
    /* --slate is 3.98:1 on the ground — fine for a rule or a dot, below AA for
       the 9-11px mono this panel is built from. Text takes --slate-text (7.1:1),
       --slate stays for non-text furniture only. */
    --slate-text:#93B2C0;
    --route:#FF3D7F; --pin:#FFC24B; --osm:#4E7A8F; --mint:#4BE0A8;
    --mono: ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
    --sans: ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--ink);color:var(--ice);font-family:var(--sans);overflow:hidden}
  #map{position:absolute;inset:0}
  .leaflet-container{background:#0B171D}
  .leaflet-control-attribution{background:rgba(11,23,29,.82)!important;color:var(--slate-text)!important;font-size:9px!important}
  .leaflet-control-attribution a{color:var(--slate-text)!important}
  .leaflet-control-scale-line{background:rgba(11,23,29,.82)!important;border-color:var(--line)!important;
    color:var(--slate-text)!important;font-family:var(--mono)!important;font-size:9.5px!important;
    letter-spacing:.06em;border-radius:2px}
  .mapbtns a{background:var(--ink-2);color:var(--ice);border-bottom:1px solid var(--line);
    font-size:15px;line-height:30px;text-align:center;width:30px;height:30px}
  .mapbtns a:hover{background:#183441;color:var(--ice)}
  .mapbtns a:last-child{border-bottom:0}

  .panel{
    position:absolute;z-index:1000;top:12px;left:12px;width:326px;max-height:calc(100vh - 24px);
    display:flex;flex-direction:column;
    background:rgba(11,23,29,.94);border:1px solid var(--line);border-radius:2px;
    backdrop-filter:blur(10px);box-shadow:0 18px 44px rgba(0,0,0,.55);
  }
  .panel header{padding:11px 13px 9px;border-bottom:1px solid var(--line);display:flex;align-items:baseline}
  .panel h1{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.17em;text-transform:uppercase}
  .panel header span{font-family:var(--mono);font-size:9.5px;color:var(--slate-text);letter-spacing:.1em;margin-left:auto}
  .panel header .prec{margin-left:7px;padding:1px 5px;border-radius:2px;font-weight:700;
                      background:var(--line);color:var(--ice)}
  .panel header .prec.on{background:var(--pin);color:#3A2600}
  .scroll{overflow-y:auto;padding:12px 13px 14px}
  /* on a phone the panel would otherwise cover most of the map, which is the
     one thing you need to see while tracing */
  .fold{margin-left:8px;padding:1px 6px;font-size:11px;line-height:1.2;background:transparent;
        border:1px solid var(--line);color:var(--slate-text)}
  .fold:hover{color:var(--ice)}
  .panel.folded .scroll{display:none}
  .panel.folded .fold{transform:rotate(180deg)}
  .lbl{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.19em;text-transform:uppercase;
       color:var(--slate-text);margin:0 0 6px}
  .lbl.mt{margin-top:14px}
  .lbl .qual,.lbl .rank{letter-spacing:.1em;text-transform:none;opacity:.72}
  .lbl .qual:before{content:"— "}

  /* settings used once a session fold away instead of competing with the work */
  .drawer{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
  .drawer summary{font-family:var(--mono);font-size:9px;letter-spacing:.19em;text-transform:uppercase;
                  color:var(--slate-text);cursor:pointer;list-style:none;padding:2px 0;margin-bottom:0}
  .drawer summary::-webkit-details-marker{display:none}
  .drawer summary:before{content:"+ ";color:var(--slate-text)}
  .drawer[open] summary:before{content:"– "}
  .drawer summary:hover{color:var(--ice)}
  .drawer summary:focus-visible{outline:2px solid var(--pin);outline-offset:2px}
  .drawer[open] summary{margin-bottom:8px}
  .drawer.danger[open] summary{color:#FF7DA6}

  /* sits above .scroll, so it survives the fold */
  .readout{border-bottom:1px solid var(--line);flex:none}
  .readout .big{padding:9px 12px 6px;display:flex;align-items:flex-end;gap:6px}
  .num{font-family:var(--mono);font-size:33px;line-height:.9;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .unit{font-family:var(--mono);font-size:11px;color:var(--slate-text);padding-bottom:3px}
  .cap{padding:0 12px 9px;font-family:var(--mono);font-size:10px;color:var(--slate-text);letter-spacing:.05em;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .strip{border-top:1px solid var(--line);padding:7px 12px;display:flex;align-items:center;gap:8px;
         font-family:var(--mono);font-size:10.5px;color:var(--slate-text);letter-spacing:.06em}
  .strip b{color:var(--route);font-weight:600;font-variant-numeric:tabular-nums;font-size:12px}
  .strip.none b{color:var(--slate-text)}

  /* The comparison: how much longer this line is than the shortest one traced.
     It is the answer the instrument exists to give, so it sits directly under
     the measurement rather than in the list. */
  .cmp{border-top:1px solid var(--line);padding:7px 12px;display:flex;align-items:baseline;gap:8px;
       font-family:var(--mono);font-size:10.5px;color:var(--slate-text);letter-spacing:.06em}
  .cmp b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--ice)}
  .cmp.best b{color:var(--mint);font-size:11px;letter-spacing:.12em}
  .cmp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  button{font-family:var(--sans);font-size:12px;color:var(--ice);background:var(--ink-2);
         border:1px solid var(--line);border-radius:2px;padding:8px 6px;cursor:pointer;
         transition:background .12s,border-color .12s,color .12s}
  button:hover{background:#183441}
  /* every focusable surface, not just <button> — the select, the slider, the
     map and Leaflet's own links were falling back to the UA ring */
  button:focus-visible,select:focus-visible,input:focus-visible,
  [role=option]:focus-visible,a:focus-visible,#map:focus-visible{
    outline:2px solid var(--pin);outline-offset:1px}
  ::selection{background:var(--pin);color:#3A2600}
  .scroll{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .scroll::-webkit-scrollbar{width:9px}
  .scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
  .scroll::-webkit-scrollbar-track{background:transparent}
  button.on{background:var(--ice);border-color:var(--ice);color:#0B171D;font-weight:600}
  button.ghost{background:transparent;font-size:11px;padding:7px 4px;color:var(--slate-text)}
  button.ghost:hover{color:var(--ice);background:var(--ink-2)}
  button.ghost:disabled{opacity:.35;cursor:default;background:transparent;color:var(--slate-text)}
  button.warn:hover{color:#FF7DA6;border-color:#4A2437}

  .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .g2{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
  .mb{margin-bottom:12px}

  .seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;margin-bottom:12px}
  .seg button{flex:1;border:0;border-right:1px solid var(--line);border-radius:0;font-size:11px}
  .seg button:last-child{border-right:0}

  .paths{border:1px solid var(--line);border-radius:2px;max-height:190px;overflow-y:auto}
  .p{display:flex;align-items:center;gap:8px;padding:7px 9px;border-bottom:1px solid var(--line);cursor:pointer}
  .p:last-child{border-bottom:0}
  .p:hover{background:var(--ink-2)}
  .p.sel{background:#16303B}
  .sw{width:9px;height:9px;border-radius:50%;flex:none}
  .p .nm{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p.sel .nm{font-weight:600}
  .p .mt{font-family:var(--mono);font-size:11px;color:var(--ice);font-variant-numeric:tabular-nums}
  /* fixed-width right-aligned column so magnitudes stack and can be scanned */
  .p .dlt{font-family:var(--mono);font-size:10px;font-variant-numeric:tabular-nums;
          color:var(--slate-text);min-width:52px;text-align:right}
  .p.win .dlt{color:var(--mint)}
  .p.borrowed{cursor:default}
  .p.borrowed .nm,.p.borrowed .mt{color:var(--slate-text)}
  .empty{padding:14px 10px;text-align:center;font-size:11px;color:var(--slate-text)}
  /* the delete affordance is a real button: focusable, named, and big enough to hit */
  .x{font-family:var(--mono);font-size:14px;line-height:1;color:var(--slate-text);
     background:transparent;border:0;border-radius:2px;padding:6px 7px;margin:-6px -5px -6px 0;cursor:pointer}
  .x:hover{color:#FF7DA6;background:#1B2E38}

  .row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  input[type=range]{flex:1;accent-color:var(--ice);height:18px}
  .row output{font-family:var(--mono);font-size:11px;min-width:36px;text-align:right}
  select{width:100%;font-family:var(--sans);font-size:12px;color:var(--ice);background:var(--ink-2);
         border:1px solid var(--line);border-radius:2px;padding:7px 6px;margin-bottom:12px}

  .hint{font-size:11px;line-height:1.55;color:var(--slate-text);border-top:1px solid var(--line);padding-top:10px;margin:14px 0 0}
  .hint b{color:var(--ice);font-weight:600}
  kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:2px;padding:0 3px;color:var(--ice)}

  .pin{width:20px;height:20px;border-radius:50%;background:var(--pin);color:#3A2600;
       font:600 11px/20px var(--mono);text-align:center;border:2px solid #0B171D;box-shadow:0 2px 6px rgba(0,0,0,.5)}
  /* wrapper centres the dot inside the icon box, so the dot can grow with zoom
     without drifting off the vertex it marks */
  .vxw{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  .vx{width:11px;height:11px;border-radius:50%;background:var(--ice);border:2px solid #0B171D;box-shadow:0 1px 3px rgba(0,0,0,.6)}
  .vx.end{background:var(--pin);width:13px;height:13px}
  .vx.sel{background:var(--route);width:15px;height:15px;box-shadow:0 0 0 4px rgba(255,61,127,.28)}
  .zoom-hi .vx{width:14px;height:14px}
  .zoom-hi .vx.end{width:16px;height:16px}
  .zoom-hi .vx.sel{width:19px;height:19px}

  .cands{border:1px solid var(--line);border-radius:2px;margin-bottom:8px}
  .c{display:flex;align-items:center;gap:8px;padding:8px 9px;border-bottom:1px solid var(--line);cursor:pointer}
  .c:last-child{border-bottom:0}
  .c:hover{background:var(--ink-2)}
  .c.sel{background:#16303B}
  .c .nm{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c.sel .nm{font-weight:600}
  .c .len{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ice)}
  .c .dlt{font-family:var(--mono);font-size:9.5px;font-variant-numeric:tabular-nums;color:var(--slate-text);min-width:44px;text-align:right}
  .c.win .dlt{color:#4BE0A8}
  .c .dlt{color:var(--slate-text)}
  /* raised off 8.5px: the verdict was the smallest text in the app */
  .bad{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:#0B171D;background:var(--mint);
       padding:2px 5px;border-radius:2px;font-weight:700;white-space:nowrap}
  .c.err .len{color:#FF7DA6;font-size:10px}

  .via{width:11px;height:11px;border-radius:2px;background:var(--ice);border:2px solid #0B171D;
       box-shadow:0 1px 3px rgba(0,0,0,.6);transform:rotate(45deg)}
  .via.sel{background:var(--pin);width:14px;height:14px;box-shadow:0 0 0 4px rgba(255,194,75,.26)}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .toast{position:absolute;z-index:1200;bottom:20px;left:50%;transform:translateX(-50%);
         background:var(--ink-2);border:1px solid var(--line);border-left:2px solid var(--pin);
         padding:8px 14px;font-size:12px;border-radius:2px;opacity:0;pointer-events:none;
         max-width:min(520px,calc(100vw - 32px));transition:opacity .2s}
  .toast.show{opacity:1}
  .busy{position:absolute;z-index:1200;top:12px;right:60px;background:var(--ink-2);border:1px solid var(--line);
        padding:6px 6px 6px 12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
        border-radius:2px;display:none;align-items:center;gap:10px}
  .busy.show{display:flex}
  .busy-x{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
          padding:4px 8px;background:transparent;border:1px solid var(--line);color:var(--slate-text)}
  .busy-x:hover{color:#FF7DA6;border-color:#4A2437;background:transparent}

  /* consent, inline over the map rather than a modal — nothing is interrupted
     and the area under discussion stays visible behind it */
  .ask{position:absolute;z-index:1250;left:50%;bottom:26px;transform:translateX(-50%);
       width:min(420px,calc(100vw - 32px));background:rgba(11,23,29,.96);border:1px solid var(--line);
       border-radius:2px;box-shadow:0 18px 44px rgba(0,0,0,.55);backdrop-filter:blur(10px);
       padding:13px;display:none}
  .ask.show{display:block}
  .ask p{margin:0 0 11px;font-size:12.5px;line-height:1.5}
  .ask p span{color:var(--slate-text);font-family:var(--mono);font-size:10.5px;letter-spacing:.04em}
  .ask div{display:flex;gap:6px;justify-content:flex-end}
  .ask button{min-width:96px}
  .drawing{cursor:crosshair}

  @media (max-width:720px){
    .panel{top:auto;bottom:0;left:0;right:0;width:auto;max-height:72vh;border-radius:0;border-left:0;border-right:0;border-bottom:0}
    /* folded on a phone still shows the number, because that is the product */
    .panel.folded{max-height:none}
    .num{font-size:27px}
    /* thumb-sized targets where a finger is the only input: 44px minimum */
    button{padding:14px 8px;min-height:44px}
    button.ghost{padding:14px 6px;font-size:12px;min-height:44px}
    .seg button{padding:14px 6px;min-height:44px}
    .fold{padding:12px 16px;font-size:14px;min-height:44px}
    select{padding:13px 8px;min-height:44px}
    .x{padding:13px 14px;font-size:16px;min-height:44px}
    .p,.c{padding:13px 9px;min-height:44px}
    .drawer summary{padding:12px 0;min-height:44px;display:flex;align-items:center}
    input[type=range]{height:44px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="map"></div>
<div class="toast" id="toast"></div>
<div class="busy" id="busy"></div>
<div class="ask" id="ask" role="dialog" aria-live="polite" aria-label="Load street network"></div>
<!-- announcements for state that was previously only colour, motion or a toast -->
<div id="sr" class="sr" role="status" aria-live="polite"></div>

<section class="panel">
  <header><h1>Trace &amp; Route</h1><span id="tag">ADD</span><span class="prec" id="prec-tag">NETWORK</span>
    <button class="fold" id="fold" aria-label="Collapse the panel" aria-expanded="true">▾</button></header>

  <!-- The readout lives outside .scroll so that folding the panel on a phone
       hides the settings and keeps the measurement, which is the one thing that
       must never leave the screen. -->
  <div class="readout" role="status" aria-live="polite">
    <div class="big"><span class="num" id="plen">0</span><span class="unit" id="punit">m</span></div>
    <div class="cap" id="pcap">No path yet</div>
    <div class="cmp" id="cmp" hidden></div>
    <div class="strip none" id="strip">ROUTE <b id="rlen">—</b><span id="rcap">not set</span></div>
  </div>

  <div class="scroll">

    <div class="seg" role="group" aria-label="Mode">
      <button id="m-add" class="on" aria-pressed="true">Add points</button>
      <button id="m-edit" aria-pressed="false">Edit points</button>
      <button id="m-route" aria-pressed="false">Route</button>
    </div>

    <div id="tools-add">
      <p class="lbl" id="lbl-input">Input</p>
      <div class="seg" role="group" aria-labelledby="lbl-input">
        <button id="in-click" class="on" aria-pressed="true">Click points</button>
        <button id="in-free" aria-pressed="false">Freehand drag</button>
      </div>
      <p class="lbl" id="lbl-attach">Attach new points to</p>
      <div class="seg" role="group" aria-labelledby="lbl-attach">
        <button id="end-end" class="on" aria-pressed="true">End of path</button>
        <button id="end-start" aria-pressed="false">Start of path</button>
      </div>
    </div>

    <div id="tools-edit" hidden>
      <div class="g2 mb">
        <button class="ghost warn" id="del-pt" disabled>Delete point</button>
        <button class="ghost" id="split-pt" disabled>Split path here</button>
      </div>
    </div>

    <div id="tools-route" hidden>
      <div class="g2 mb">
        <button id="set-a">Set start</button>
        <button id="set-b">Set finish</button>
      </div>
      <p class="lbl">Options from A to B</p>
      <div class="cands" id="clist" role="listbox" aria-label="Options from A to B"><div class="empty">Place a start and a finish</div></div>
      <div class="g3 mb">
        <button class="ghost" id="c-new">Variant</button>
        <button class="ghost" id="del-via" disabled>Drop via</button>
        <button class="ghost warn" id="clr-route">Reset</button>
      </div>
    </div>

    <p class="lbl" id="lbl-paths">Traced paths <span class="rank" id="rank-note"></span></p>
    <div class="paths" id="list" role="listbox" aria-labelledby="lbl-paths">
      <div class="empty">Click the map to start your first path</div>
    </div>
    <div class="g2" style="margin-top:6px">
      <button class="ghost" id="new-path">New path</button>
      <button class="ghost" id="undo">Undo</button>
    </div>

    <p class="lbl mt" id="lbl-mm">Measurement mode</p>
    <div class="seg" role="group" aria-labelledby="lbl-mm">
      <button id="pm-net" class="on" aria-pressed="true">Network</button>
      <button id="pm-prec" aria-pressed="false">Precision</button>
    </div>

    <!-- Named for what it actually governs. It fuses nodes in the routing
         graph; it never moves a point the user placed. -->
    <p class="lbl">Junction tolerance <span class="qual">routing only</span></p>
    <div class="row">
      <input type="range" id="snap" min="1" max="40" value="10" aria-label="Junction tolerance in metres, used for routing only">
      <output id="snap-out">10 m</output>
    </div>

    <label class="lbl" for="base">Basemap</label>
    <select id="base">
      <option value="street">Street — OpenStreetMap</option>
      <option value="topo">Terrain — OpenTopoMap</option>
      <option value="light">Light — Carto Positron</option>
      <option value="dark" selected>Dark — Carto Dark Matter</option>
      <option value="sat">Satellite — Esri</option>
    </select>

    <!-- Everything below is used at most once a session, so it folds away
         instead of competing with the work. -->
    <details class="drawer">
      <summary>Street network from OpenStreetMap</summary>
      <div class="g2">
        <button class="ghost" id="imp-bike">Load bike &amp; foot</button>
        <button class="ghost" id="imp-road">Load all roads</button>
      </div>
    </details>

    <details class="drawer">
      <summary>Files</summary>
      <div class="g3">
        <button class="ghost" id="save">GeoJSON</button>
        <button class="ghost" id="gpx">GPX</button>
        <button class="ghost" id="load">Load</button>
      </div>
      <input type="file" id="file" accept=".json,.geojson,.gpx,application/json,application/gpx+xml" hidden>
    </details>

    <details class="drawer danger">
      <summary>Erase</summary>
      <div class="g2">
        <button class="ghost warn" id="clear">Clear paths</button>
        <button class="ghost warn" id="wipe">Erase saved copy</button>
      </div>
    </details>

    <p class="hint" id="hint"></p>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
"use strict";

/* ---------------------------------- map ---------------------------------- */
const map = L.map('map',{doubleClickZoom:false, zoomControl:true, attributionControl:true})
  .setView([64.1466,-21.9426],14);
map.zoomControl.setPosition('topright');

const BASES = {
  street:['https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png','&copy; OpenStreetMap',19],
  topo:['https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png','&copy; OpenStreetMap, SRTM · OpenTopoMap',17],
  light:['https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png','&copy; OpenStreetMap &copy; CARTO',20],
  dark:['https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png','&copy; OpenStreetMap &copy; CARTO',20],
  sat:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}','Imagery &copy; Esri',19]
};
let baseLayer=null;
function setBase(k){
  if(baseLayer) map.removeLayer(baseLayer);
  const b=BASES[k];
  baseLayer=L.tileLayer(b[0],{attribution:b[1],maxNativeZoom:b[2],maxZoom:20,detectRetina:true}).addTo(map);
  baseLayer.bringToBack();
}
setBase('dark');
document.getElementById('base').onchange = e => { setBase(e.target.value); persist(); };

/* The imported network is thousands of lines and never changes while you draw,
   so it lives on its own canvas layer underneath and is only repainted when the
   import itself changes. Drawn paths stay on SVG: there are few of them and
   they need crisp hit targets. */
const osmCanvas=L.canvas({padding:0.3});
const gOSM  =L.layerGroup().addTo(map);
const gPaths=L.layerGroup().addTo(map);
const gRoute=L.layerGroup().addTo(map);
const gVerts=L.layerGroup().addTo(map);
const gPins =L.layerGroup().addTo(map);
const gHint =L.layerGroup().addTo(map);   /* snap preview + freehand ink, never persisted */

/* -------------------------------- geometry -------------------------------- */
const R=6371008.8, rad=d=>d*Math.PI/180;
function hav(a,b){
  const dLat=rad(b.lat-a.lat), dLng=rad(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
let kx=Math.cos(rad(64.15));
const PX=p=>p.lng*kx, PY=p=>p.lat;
function segInt(A,B,P,Q){
  const ax=PX(A),ay=PY(A),bx=PX(B),by=PY(B),px=PX(P),py=PY(P),qx=PX(Q),qy=PY(Q);
  const rx=bx-ax,ry=by-ay,sx=qx-px,sy=qy-py, den=rx*sy-ry*sx;
  if(Math.abs(den)<1e-16) return null;
  const t=((px-ax)*sy-(py-ay)*sx)/den, u=((px-ax)*ry-(py-ay)*rx)/den, e=1e-9;
  if(t<-e||t>1+e||u<-e||u>1+e) return null;
  return {t:t,u:u};
}
function lerp(A,B,t){ return {lat:A.lat+t*(B.lat-A.lat), lng:A.lng+t*(B.lng-A.lng)}; }
function projOn(P,A,B){
  const ax=PX(A),ay=PY(A),dx=PX(B)-ax,dy=PY(B)-ay, L2=dx*dx+dy*dy;
  let t = L2 ? ((PX(P)-ax)*dx+(PY(P)-ay)*dy)/L2 : 0;
  t=Math.max(0,Math.min(1,t));
  const pt=lerp(A,B,t);
  return {t:t, pt:pt, d:hav(P,pt)};
}
function pathLen(p){ let s=0; for(let i=1;i<p.pts.length;i++) s+=hav(p.pts[i-1],p.pts[i]); return s; }

/* Douglas–Peucker in a local metre plane. ONLY ever applied to a freehand run
   that has not yet joined a path — see FREEHAND_SIMPLIFY_M. Never call this on
   a stored pts[] array: the user's trace is ground truth. */
const MPD=111320;                       /* metres per degree of latitude */
function simplifyDP(pts,tolM){
  if(pts.length<3) return pts.slice();
  const x=pts.map(p=>p.lng*kx*MPD), y=pts.map(p=>p.lat*MPD);
  const keep=new Array(pts.length).fill(false);
  keep[0]=keep[pts.length-1]=true;
  const stack=[[0,pts.length-1]];
  while(stack.length){
    const seg=stack.pop(), a=seg[0], b=seg[1];
    if(b-a<2) continue;
    const ax=x[a],ay=y[a],dx=x[b]-ax,dy=y[b]-ay, L2=dx*dx+dy*dy;
    let bi=-1,bd=tolM;
    for(let i=a+1;i<b;i++){
      let t = L2 ? ((x[i]-ax)*dx+(y[i]-ay)*dy)/L2 : 0;
      t=Math.max(0,Math.min(1,t));
      const ex=x[i]-(ax+t*dx), ey=y[i]-(ay+t*dy), d=Math.sqrt(ex*ex+ey*ey);
      if(d>bd){ bd=d; bi=i; }
    }
    if(bi<0) continue;
    keep[bi]=true; stack.push([a,bi],[bi,b]);
  }
  return pts.filter((p,i)=>keep[i]);
}
/* Metres, always. The product exists to resolve differences of a few metres
   between two lines; `(m/1000).toFixed(2)` throws away 10 m of that above a
   kilometre, which is coarser than the thing being measured. Thin space groups
   the thousands so 4163 stays readable without becoming 4.16. */
function fmt(m){
  if(m==null) return ['—',''];
  return [Math.round(m).toLocaleString('en-GB').replace(/,/g,' '),'m'];
}
/* signed, for a difference against another line */
function fmtDelta(m){
  const r=Math.round(m);
  if(r===0) return '±0 m';
  return (r>0?'+':'−')+Math.abs(r).toLocaleString('en-GB').replace(/,/g,' ')+' m';
}

/* --------------------------------- state --------------------------------- */
/* Neither accent may appear here. Survey Amber is what a fixed point looks like
   (the A/B pins), Verdict Mint means "this is the shortest" and nothing else —
   a drawn path wearing either colour makes both rules unreadable. The old teal
   sat close enough to mint on satellite imagery to be mistaken for it, so it is
   shifted cool and blue. */
const PALETTE=['#4FC3E8','#8FA6FF','#FF9F6E','#C48FFF','#B6E04B'];
let paths=[], activeId=null, seq=0, colorSeq=0;
let mode='add', appendTo='end', inputMode='click';
let selVert=null;
let A=null, B=null, pickNext=null;
let dirty=true, graph=null;
let history=[], redoStack=[];

/* Precision mode exists because a 10 m snap welds a left-side and a right-side
   trace of the same street into one line, which destroys the measurement. */
const PRECISION_SNAP_M=0.5;
let precision=false;

const snapEl=document.getElementById('snap');
const snapM=()=> precision ? PRECISION_SNAP_M : +snapEl.value;

const uuid=()=> (self.crypto&&self.crypto.randomUUID) ? self.crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
      const r=Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); });
function stamp(o){ if(o&&!o.uid) o.uid=uuid(); if(o) o.updatedAt=Date.now(); return o; }

function newPath(name){
  const p={id:++seq, uid:uuid(), updatedAt:Date.now(),
           name:name||('Path '+(paths.filter(x=>x.source!=='osm').length+1)),
           pts:[], color:PALETTE[colorSeq++%PALETTE.length], source:'drawn'};
  paths.push(p); activeId=p.id; return p;
}
const active=()=>paths.find(p=>p.id===activeId)||null;
const byId=id=>paths.find(p=>p.id===id);

/* Undo covers the routing work too: deleting an option or dropping a via was
   otherwise unrecoverable. Candidates are stored by their vias, as everywhere
   else — never by their solved geometry. */
/* Screen-reader announcements for things that only existed as colour or motion:
   the solved distance, a finished import, a nudged point. Kept off the readout's
   own live region so a via drag does not machine-gun the speech queue. */
function announce(msg){
  const el=document.getElementById('sr');
  if(!el) return;
  el.textContent='';
  setTimeout(function(){ el.textContent=msg; },40);
}
function save(){
  redoStack.length=0;                 /* a new action forks the timeline */
  history.push(JSON.stringify({
    paths:paths,
    cands:cands.map(function(c){ return {id:c.id,uid:c.uid,name:c.name,color:c.color,vias:c.vias}; }),
    A:A, B:B, activeId:activeId, activeCand:activeCand
  }));
  if(history.length>50) history.shift();
}
function snapNow(){
  return JSON.stringify({
    paths:paths,
    cands:cands.map(function(c){ return {id:c.id,uid:c.uid,name:c.name,color:c.color,vias:c.vias}; }),
    A:A, B:B, activeId:activeId, activeCand:activeCand
  });
}
function redo(){
  const s=redoStack.pop(); if(!s){ toast('Nothing to redo'); return; }
  history.push(snapNow());
  restoreSnapshot(JSON.parse(s));
  toast('Redone');
}
function undo(){
  const s=history.pop(); if(!s){ toast('Nothing to undo'); return; }
  redoStack.push(snapNow());
  /* restores a previous snapshot verbatim — no re-derivation of point arrays */
  restoreSnapshot(JSON.parse(s));
}
function restoreSnapshot(st){
  paths=st.paths||[];
  if(!byId(st.activeId)) activeId = paths.length?paths[paths.length-1].id:null; else activeId=st.activeId;
  cands=(st.cands||[]).map(function(c){
    return {id:c.id,uid:c.uid,updatedAt:Date.now(),name:c.name,color:c.color,
            vias:c.vias||[],legs:[],len:null,err:null};
  });
  activeCand = cands.some(c=>c.id===st.activeCand) ? st.activeCand : (cands.length?cands[cands.length-1].id:null);
  A=st.A||null; B=st.B||null;
  selVert=null; selVia=null; dirty=vDirty=true;
  render(); drawPins();
  if(A&&B) solveAll(); else { gRoute.clearLayers(); candPanel(); strip(); }
  persist();
}
function touch(){ dirty=vDirty=true; render(); if(A&&B) solveAll(); persist(); }

/* ---- vertex index: cheap grid over every path point, for snap preview ----
   Separate from the routing graph on purpose: the graph does segment noding,
   which is far too expensive to rebuild on mousemove. */
const VCELL=0.0006;                        /* ~66 m of latitude per cell */
let vIdx=null, vDirty=true;
function buildVIdx(){
  const m=new Map();
  for(const p of paths) for(const pt of p.pts){
    const k=Math.floor(pt.lat/VCELL)+':'+Math.floor(pt.lng/VCELL);
    let a=m.get(k); if(!a){ a=[]; m.set(k,a); }
    a.push(pt);
  }
  vIdx=m; vDirty=false;
}
function nearestVertex(ll,tol){
  if(vDirty||!vIdx) buildVIdx();
  const ci=Math.floor(ll.lat/VCELL), cj=Math.floor(ll.lng/VCELL);
  let best=null, bd=tol;
  for(let i=ci-1;i<=ci+1;i++) for(let j=cj-1;j<=cj+1;j++){
    const arr=vIdx.get(i+':'+j); if(!arr) continue;
    for(let n=0;n<arr.length;n++){
      const d=hav(arr[n],ll);
      if(d<=bd){ bd=d; best=arr[n]; }
    }
  }
  return best;
}

/* ------------------------------ graph builder ------------------------------ */
function buildGraph(){
  const nodes=[], adj=new Map(), tol=snapM();
  const dLat=tol/111320, dLng=tol/(111320*Math.max(kx,.05));
  const cell=Math.max(dLat,dLng)*2;
  const reg=new Map();
  function nodeAt(pt){
    const ci=Math.floor(pt.lat/cell), cj=Math.floor(pt.lng/cell);
    let best=-1,bd=tol;
    for(let i=ci-1;i<=ci+1;i++) for(let j=cj-1;j<=cj+1;j++){
      const arr=reg.get(i+':'+j); if(!arr) continue;
      for(let n=0;n<arr.length;n++){ const d=hav(nodes[arr[n]],pt); if(d<=bd){bd=d;best=arr[n];} }
    }
    if(best>=0) return best;
    const id=nodes.push({lat:pt.lat,lng:pt.lng})-1;
    const k=ci+':'+cj;
    if(!reg.has(k)) reg.set(k,[]);
    reg.get(k).push(id);
    return id;
  }
  function link(a,b){
    if(a===b) return;
    if(!adj.has(a)) adj.set(a,new Set());
    if(!adj.has(b)) adj.set(b,new Set());
    adj.get(a).add(b); adj.get(b).add(a);
  }

  const segs=[];
  for(const p of paths) for(let i=0;i<p.pts.length-1;i++) segs.push({A:p.pts[i],B:p.pts[i+1]});

  const SC=0.002, gi=new Map();
  function cellsOf(s){
    const x0=Math.floor(Math.min(s.A.lng,s.B.lng)/SC), x1=Math.floor(Math.max(s.A.lng,s.B.lng)/SC);
    const y0=Math.floor(Math.min(s.A.lat,s.B.lat)/SC), y1=Math.floor(Math.max(s.A.lat,s.B.lat)/SC);
    const out=[];
    for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) out.push(x+':'+y);
    return out;
  }
  segs.forEach((s,i)=>{ for(const k of cellsOf(s)){ if(!gi.has(k)) gi.set(k,[]); gi.get(k).push(i); } });

  const cuts=segs.map(()=>[]);
  segs.forEach((s,i)=>{
    const seen=new Set();
    for(const k of cellsOf(s)){
      const bucket=gi.get(k)||[];
      for(let n=0;n<bucket.length;n++){
        const j=bucket[n];
        if(j<=i||seen.has(j)) continue;
        seen.add(j);
        const r=segInt(s.A,s.B,segs[j].A,segs[j].B);
        if(!r) continue;
        if(r.t>1e-9&&r.t<1-1e-9) cuts[i].push(r.t);
        if(r.u>1e-9&&r.u<1-1e-9) cuts[j].push(r.u);
      }
    }
  });

  segs.forEach((s,i)=>{
    const ts=[0].concat(cuts[i]).concat([1]).sort((a,b)=>a-b);
    let prev=nodeAt(s.A), pt=0;
    for(let k=1;k<ts.length;k++){
      if(ts[k]-pt<1e-9) continue;
      const id=nodeAt(ts[k]>=1?s.B:lerp(s.A,s.B,ts[k]));
      link(prev,id); prev=id; pt=ts[k];
    }
  });

  /* fixed-size grid over the routable nodes, so "which node is nearest this
     click" does not have to walk every node in the city. Deliberately not the
     snap-sized grid above: in Precision mode that cell is about a metre across,
     which would mean thousands of empty cells per lookup. */
  const qreg=new Map();
  for(let i=0;i<nodes.length;i++){
    if(!adj.has(i)) continue;
    const k=Math.floor(nodes[i].lat/QCELL)+':'+Math.floor(nodes[i].lng/QCELL);
    let a=qreg.get(k); if(!a){ a=[]; qreg.set(k,a); }
    a.push(i);
  }
  graph={nodes:nodes,adj:adj,qreg:qreg}; dirty=false;
  return graph;
}
const QCELL=0.0015;   /* ~165 m of latitude */
function G(){ return (dirty||!graph) ? buildGraph() : graph; }

function nearestGraphNode(ll){
  const g=G();
  if(!g.qreg||!g.qreg.size) return -1;
  const ci=Math.floor(ll.lat/QCELL), cj=Math.floor(ll.lng/QCELL);
  let best=-1,bd=Infinity;
  /* narrowest cell dimension in metres — longitude cells are the short side at
     this latitude, and the safe stopping rule has to use the short side */
  const cellM=QCELL*111320*Math.max(kx,.05);
  for(let ring=0;ring<=400;ring++){
    for(let i=ci-ring;i<=ci+ring;i++) for(let j=cj-ring;j<=cj+ring;j++){
      if(ring>0 && Math.abs(i-ci)!==ring && Math.abs(j-cj)!==ring) continue;  /* boundary only */
      const arr=g.qreg.get(i+':'+j); if(!arr) continue;
      for(let n=0;n<arr.length;n++){
        const d=hav(g.nodes[arr[n]],ll);
        if(d<bd){ bd=d; best=arr[n]; }
      }
    }
    /* keep expanding until no unscanned cell could still hold anything closer */
    if(best>=0 && ring*cellM>=bd) break;
  }
  return best;
}
/* Binary min-heap for the Dijkstra frontier. A whole-city road import is tens
   of thousands of nodes, and the old linear scan of the frontier made that
   unusable — this is handoff §5.7's heap, done because it started to bite. */
function Heap(){ this.a=[]; }
Heap.prototype.push=function(d,v){
  const a=this.a; a.push([d,v]);
  let i=a.length-1;
  while(i>0){ const p=(i-1)>>1; if(a[p][0]<=a[i][0]) break; const t=a[p]; a[p]=a[i]; a[i]=t; i=p; }
};
Heap.prototype.pop=function(){
  const a=this.a, top=a[0], last=a.pop();
  if(a.length){
    a[0]=last;
    let i=0;
    for(;;){
      const l=2*i+1, r=l+1; let m=i;
      if(l<a.length&&a[l][0]<a[m][0]) m=l;
      if(r<a.length&&a[r][0]<a[m][0]) m=r;
      if(m===i) break;
      const t=a[m]; a[m]=a[i]; a[i]=t; i=m;
    }
  }
  return top;
};
function dijkstra(src,dst){
  const g=G(), dist=new Map([[src,0]]), prev=new Map(), done=new Set(), pq=new Heap();
  pq.push(0,src);
  while(pq.a.length){
    const top=pq.pop(), d=top[0], u=top[1];
    if(done.has(u)) continue;
    done.add(u);
    if(u===dst) break;
    const nb=g.adj.get(u); if(!nb) continue;
    for(const v of nb){
      if(done.has(v)) continue;
      const nd=d+hav(g.nodes[u],g.nodes[v]);
      if(nd<(dist.has(v)?dist.get(v):Infinity)){ dist.set(v,nd); prev.set(v,u); pq.push(nd,v); }
    }
  }
  if(!dist.has(dst)) return null;
  const out=[dst];
  while(out[0]!==src){ const p=prev.get(out[0]); if(p===undefined) return null; out.unshift(p); }
  return {path:out.map(i=>g.nodes[i]), len:dist.get(dst)};
}

/* -------------------------------- rendering -------------------------------- */
/* cheap fingerprint of the imported set, so the canvas is rebuilt when an import
   changes and left alone the rest of the time */
let paintedOSM=null;
function osmSignature(){
  let n=0, first='', last='';
  for(const p of paths) if(p.source==='osm'){ if(!n) first=p.uid||''; last=p.uid||''; n++; }
  return n+':'+first+':'+last;
}
/* The Borrowed Data Rule, applied to the basemap as well as to drawn paths:
   thousands of imported ways at 2px/75% turn the satellite imagery you trace
   against into a mesh. It stays a faint reference, and disappears entirely when
   you are zoomed out far enough that it cannot be the thing you are working on. */
const OSM_MIN_ZOOM=15;
function repaintOSM(force){
  const sig=osmSignature()+':'+(map.getZoom()<OSM_MIN_ZOOM?'hidden':'shown');
  if(!force && sig===paintedOSM) return;
  paintedOSM=sig;
  gOSM.clearLayers();
  if(map.getZoom()<OSM_MIN_ZOOM) return;
  for(const p of paths){
    if(p.source!=='osm'||p.pts.length<2) continue;
    L.polyline(p.pts,{color:'#4E7A8F',weight:1,opacity:.45,renderer:osmCanvas,interactive:false})
      .addTo(gOSM);
  }
}
function repaintLines(){
  repaintOSM(false);
  gPaths.clearLayers();
  for(const p of paths){
    if(p.source==='osm'||p.pts.length<2) continue;
    const act=p.id===activeId;
    if(act) L.polyline(p.pts,{color:'#FFFFFF',weight:8,opacity:.16,interactive:false}).addTo(gPaths);
    L.polyline(p.pts,{color:p.color, weight:act?4:3, opacity:act?1:.7})
      .addTo(gPaths).on('click', function(ev){
      if(mode==='route') return;
      L.DomEvent.stop(ev);
      if(swallowClick){ swallowClick=false; return; }   /* end of a freehand drag */
      if(mode==='add' && p.id===activeId){ insertOnPath(p, ev.latlng); return; }
      activeId=p.id; selVert=null; render();
    });
  }
}
/* Vertices are drawn only for what is on screen, so a dense freehand path stays
   editable point-by-point at zoom 20 instead of being hidden past a count cap. */
const VERT_MAX=900;
let vertHidden=0;   /* points on screen that were too dense to draw handles for */
function render(){
  repaintLines();
  gVerts.clearLayers();
  const a=active();
  const zHi=map.getZoom()>=19;
  map.getContainer().classList.toggle('zoom-hi',zHi);
  const box=map.getBounds().pad(0.2);
  vertHidden=0;
  if(a && (mode==='add'||mode==='edit') && a.pts.length){
    let shown=0;
    a.pts.forEach(function(pt,i){
      if(!box.contains(pt)) return;
      if(++shown>VERT_MAX){ vertHidden++; return; }
      const isEnd = i===0||i===a.pts.length-1;
      const isSel = selVert && selVert.pathId===a.id && selVert.i===i;
      const cls='vx'+(isEnd?' end':'')+(isSel?' sel':'');
      const s=zHi?22:16;                       /* hit target grows with zoom */
      const m=L.marker(pt,{
        icon:L.divIcon({className:'',html:'<div class="vxw"><div class="'+cls+'"></div></div>',
                        iconSize:[s,s],iconAnchor:[s/2,s/2]}),
        draggable: mode==='edit', keyboard:false, zIndexOffset:400
      }).addTo(gVerts);
      m.on('click', function(ev){ L.DomEvent.stop(ev); selVert={pathId:a.id,i:i}; render(); });
      m.on('dragstart', function(){ save(); });
      /* moves one point the user grabbed, nothing else */
      m.on('drag', function(ev){ a.pts[i]={lat:ev.latlng.lat,lng:ev.latlng.lng}; repaintLines(); });
      m.on('dragend', function(){ stamp(a); selVert={pathId:a.id,i:i}; touch(); });
    });
  }
  drawPins(); panel();
}
function drawPins(){
  gPins.clearLayers();
  if(A) L.marker(A,{icon:L.divIcon({className:'',html:'<div class="pin">A</div>',iconSize:[20,20],iconAnchor:[10,10]}),zIndexOffset:600}).addTo(gPins);
  if(B) L.marker(B,{icon:L.divIcon({className:'',html:'<div class="pin">B</div>',iconSize:[20,20],iconAnchor:[10,10]}),zIndexOffset:600}).addTo(gPins);
}

/* summing every imported way is tens of thousands of haversines, and the panel
   redraws on every pan — so it is cached against the same fingerprint */
let osmLenCache={sig:null,len:0};
function osmTotalLen(osm){
  const sig=osmSignature();
  if(osmLenCache.sig!==sig) osmLenCache={sig:sig,len:osm.reduce((s,p)=>s+pathLen(p),0)};
  return osmLenCache.len;
}
/* the shortest measurable drawn path — the thing every other trace is compared
   against, and the only path allowed to wear the verdict colour */
function measurable(){ return paths.filter(p=>p.source!=='osm'&&p.pts.length>1); }
function shortestDrawn(){
  return measurable().sort(function(x,y){ return pathLen(x)-pathLen(y); })[0]||null;
}
function panel(){
  const a=active();
  const f=fmt(a? (a.pts.length>1?pathLen(a):0) : null);
  const numEl=document.getElementById('plen');
  numEl.textContent = a? f[0] : '0';
  numEl.style.color = a? (a.source==='osm'?'#4E7A8F':a.color) : 'var(--slate-text)';
  document.getElementById('punit').textContent = a? (f[1]||'m') : 'm';
  document.getElementById('pcap').textContent = a
    ? a.name+' · '+a.pts.length+' point'+(a.pts.length===1?'':'s')+(a.source==='osm'?' · imported':'')
      +(vertHidden?' · '+vertHidden+' handles hidden, zoom in':'')
    : 'No path yet';

  /* The answer the tool exists to give: how much longer is this line than the
     shortest one you traced. It sits directly under the measurement because it
     is the number the user actually came for. */
  const cmp=document.getElementById('cmp'), best=shortestDrawn();
  const many=measurable().length>1;
  const note=document.getElementById('rank-note');
  if(note) note.textContent = many ? '· shortest first' : '';
  if(a && a.source!=='osm' && a.pts.length>1 && many && best){
    const diff=pathLen(a)-pathLen(best);
    cmp.hidden=false;
    cmp.classList.toggle('best',a.id===best.id);
    cmp.innerHTML = a.id===best.id
      ? '<b>SHORTEST</b><span>of '+measurable().length+' traced</span>'
      : '<b>'+fmtDelta(diff)+'</b><span>longer than '+escapeHtml(best.name)+'</span>';
  } else { cmp.hidden=true; }

  const list=document.getElementById('list');
  const drawn=measurable(), osm=paths.filter(p=>p.source==='osm');
  const unmeasured=paths.filter(p=>p.source!=='osm'&&p.pts.length<2);
  if(!paths.length){
    list.innerHTML='<div class="empty">Click the map to start your first path</div>';
  } else {
    list.innerHTML='';
    /* sorted shortest first, so the ranking is the reading order */
    drawn.slice().sort(function(x,y){ return pathLen(x)-pathLen(y); })
      .forEach(p=>list.appendChild(rowFor(p,best,drawn.length>1)));
    unmeasured.forEach(p=>list.appendChild(rowFor(p,null,false)));
    if(osm.length){
      const d=document.createElement('div');
      d.className='p borrowed';
      d.innerHTML='<span class="sw" style="background:#4E7A8F"></span>'+
        '<span class="nm">'+osm.length+' imported ways</span>'+
        /* the borrowed network is a scale figure, not a measurement — kilometres
           are the honest unit for "how much road is loaded" */
        '<span class="mt">'+(osmTotalLen(osm)/1000).toFixed(0)+' km</span>';
      const b=document.createElement('button');
      b.className='x'; b.type='button';
      b.setAttribute('aria-label','Remove all '+osm.length+' imported ways');
      b.textContent='×';
      b.onclick=function(e){
        e.stopPropagation(); save();
        paths=paths.filter(p=>p.source!=='osm');
        touch();
      };
      d.appendChild(b);
      list.appendChild(d);
    }
  }
  document.getElementById('del-pt').disabled = !selVert;
  document.getElementById('split-pt').disabled = !selVert;
}
function rowFor(p,best,ranked){
  const d=document.createElement('div');
  const win = ranked && best && p.id===best.id;
  d.className='p'+(p.id===activeId?' sel':'')+(win?' win':'');
  d.setAttribute('role','option');
  d.setAttribute('aria-selected',p.id===activeId?'true':'false');
  d.tabIndex = p.id===activeId ? 0 : -1;
  const len=p.pts.length>1?pathLen(p):null;
  const f=fmt(len);
  let delta='';
  if(ranked && best && len!=null) delta = win ? '<span class="bad">SHORTEST</span>' : fmtDelta(len-pathLen(best));
  d.innerHTML='<span class="sw" style="background:'+p.color+'"></span>'+
    '<span class="nm">'+escapeHtml(p.name)+'</span>'+
    '<span class="mt">'+(len==null?'—':f[0]+' '+f[1])+'</span>'+
    '<span class="dlt">'+delta+'</span>';
  const del=document.createElement('button');
  del.className='x'; del.type='button';
  del.setAttribute('aria-label','Delete '+p.name);
  del.textContent='×';
  del.onclick=function(e){
    e.stopPropagation(); save();
    paths=paths.filter(x=>x.id!==p.id);
    if(activeId===p.id){
      const last=paths.filter(x=>x.source!=='osm').slice(-1)[0];
      activeId=last?last.id:null;
    }
    selVert=null; touch();
  };
  d.appendChild(del);
  d.onclick=function(){ activeId=p.id; selVert=null; render(); };
  d.onkeydown=function(e){ rowKeys(e,d,p); };
  d.querySelector('.nm').ondblclick=function(e){ e.stopPropagation(); renamePath(p); };
  return d;
}
function renamePath(p){
  const nm=prompt('Name this path',p.name);
  if(nm){ p.name=nm.slice(0,40); stamp(p); render(); persist(); }
}
/* keyboard traversal for a list that was previously mouse-only */
function rowKeys(e,el,p){
  const rows=[].slice.call(el.parentNode.querySelectorAll('.p[role=option]'));
  const i=rows.indexOf(el);
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    const n=rows[i+(e.key==='ArrowDown'?1:-1)];
    if(n){ n.focus(); n.click(); }
  } else if(e.key==='Enter'||e.key===' '){
    e.preventDefault(); el.click();
  } else if(e.key==='F2'){
    e.preventDefault(); renamePath(p);
  } else if(e.key==='Delete'||e.key==='Backspace'){
    e.preventDefault(); el.querySelector('.x').click();
  }
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ------------------------------ path editing ------------------------------ */
/* A clicked point goes in exactly where it was clicked and is never revisited
   by any automatic process. Nothing in this file rewrites pts[] except the
   explicit user actions in this section. */
function addPoint(ll){
  let a=active();
  if(!a || a.source==='osm') a=newPath();
  save();
  const pt={lat:ll.lat,lng:ll.lng};
  if(appendTo==='start') a.pts.unshift(pt); else a.pts.push(pt);
  stamp(a); selVert=null; touch();
}
/* Freehand run: the captured cursor samples are simplified BEFORE they join the
   path, and only ever as a whole run. Existing points are untouched. */
function addRun(run){
  let a=active();
  if(!a || a.source==='osm') a=newPath();
  save();
  const pts=simplifyDP(run,FREEHAND_SIMPLIFY_M).map(p=>({lat:p.lat,lng:p.lng}));
  if(appendTo==='start') a.pts.unshift.apply(a.pts,pts.slice().reverse());
  else a.pts.push.apply(a.pts,pts);
  stamp(a); selVert=null; touch();
  toast('Traced '+pts.length+' points · '+fmt(pathLen(a)).join(' '));
}
function insertOnPath(p, ll){
  let best=null;
  for(let i=0;i<p.pts.length-1;i++){
    const r=projOn(ll,p.pts[i],p.pts[i+1]);
    if(!best||r.d<best.d) best={d:r.d,i:i,pt:r.pt};
  }
  if(!best) return;
  save();
  /* inserts one point on the segment nearest the click, at the clicked spot */
  p.pts.splice(best.i+1,0,best.pt);
  stamp(p);
  selVert={pathId:p.id,i:best.i+1};
  touch();
  toast('Point inserted — switch to Edit points to drag it');
}
document.getElementById('del-pt').onclick=function(){
  if(!selVert) return;
  const p=byId(selVert.pathId); if(!p) return;
  save();
  p.pts.splice(selVert.i,1); stamp(p);   /* removes only the selected point */
  if(p.pts.length===0){
    paths=paths.filter(x=>x.id!==p.id);
    const last=paths.filter(x=>x.source!=='osm').slice(-1)[0];
    activeId=last?last.id:null;
  }
  selVert=null; touch();
};
document.getElementById('split-pt').onclick=function(){
  if(!selVert) return;
  const p=byId(selVert.pathId), i=selVert.i;
  if(!p||i<1||i>p.pts.length-2){ toast('Pick a point in the middle of the path'); return; }
  save();
  /* splits the array in two at the selected point; every point survives, and
     the shared point is duplicated so both halves keep their exact geometry */
  const tail=p.pts.slice(i);
  p.pts=p.pts.slice(0,i+1); stamp(p);
  const np={id:++seq,uid:uuid(),updatedAt:Date.now(),
            name:p.name+' (2)',pts:tail.map(x=>({lat:x.lat,lng:x.lng})),
            color:PALETTE[colorSeq++%PALETTE.length],source:'drawn'};
  paths.splice(paths.indexOf(p)+1,0,np);
  activeId=np.id; selVert=null; touch();
};

/* --------------------------- route candidates ---------------------------- */
/* A candidate is one way of getting from A to B. It is defined by an ordered
   list of via points; the network is solved between consecutive vias. A
   candidate with no vias is the app's own optimal route. Dragging a via off
   onto a different path is how you turn the app's answer into your own. */

/* Verdict Mint is removed: it marks the winner in the list, so a candidate that
   draws mint on the map while losing by 972 m contradicts the badge beside it. */
const CPAL=['#FF3D7F','#7FB2FF','#FFD24B','#C48FFF','#FF9F6E','#4FC3E8'];
let cands=[], activeCand=null, candSeq=0, selVia=null;

function newCand(vias,name){
  const c={id:++candSeq, uid:uuid(), updatedAt:Date.now(),
           name:name||(candSeq===1?'Optimal':'Option '+candSeq),
           vias:(vias||[]).map(v=>({lat:v.lat,lng:v.lng})),
           color:CPAL[(candSeq-1)%CPAL.length], legs:[], len:null, err:null};
  cands.push(c); activeCand=c.id; return c;
}
const curCand=()=>cands.find(c=>c.id===activeCand)||null;

function clearRoute(){
  gRoute.clearLayers();
  cands=[]; activeCand=null; candSeq=0; selVia=null;
  const s=document.getElementById('strip');
  document.getElementById('rlen').textContent='—';
  document.getElementById('rcap').textContent = A&&B?'':(A?'finish not set':'not set');
  s.classList.add('none');
  if(document.getElementById('clist')) candPanel();
}

/* solve one candidate: A -> via1 -> ... -> B, leg by leg */
function solveCand(c){
  c.legs=[]; c.len=null; c.err=null;
  if(!A||!B){ c.err='no endpoints'; return; }
  const stops=[A].concat(c.vias,[B]);
  let total=0;
  for(let i=0;i<stops.length-1;i++){
    const na=nearestGraphNode(stops[i]), nb=nearestGraphNode(stops[i+1]);
    if(na<0||nb<0){ c.err='nothing to route on'; return; }
    if(na===nb){ c.legs.push([G().nodes[na]]); continue; }
    const r=dijkstra(na,nb);
    if(!r){
      /* in Precision the snap is half a metre, so a traced line that merely
         looks like it touches the network is genuinely not joined to it */
      c.err='leg '+(i+1)+' does not connect'+(precision?' (Precision snap is 0.5 m)':'');
      return;
    }
    c.legs.push(r.path); total+=r.len;
  }
  c.len=total;
}
function solveAll(){
  if(!A||!B){ gRoute.clearLayers(); candPanel(); strip(); return; }
  if(!cands.length) newCand([]);
  /* nothing to route on yet? fetch the streets around A and B, then re-solve */
  if(maybeAutoNetwork()){
    cands.forEach(function(c){ c.legs=[]; c.len=null; c.err=netBusy?'loading the network…':'network not loaded'; });
    gRoute.clearLayers(); candPanel(); strip(); return;
  }
  cands.forEach(solveCand);
  drawCands(); candPanel(); strip();
  const c=curCand();
  if(c&&c.len!=null&&c.len!==lastSpoken){
    lastSpoken=c.len;
    announce(c.name+': '+fmt(c.len).join(' '));
  }
}
let lastSpoken=null;
const bestCand=()=>cands.filter(c=>c.len!=null).sort((a,b)=>a.len-b.len)[0]||null;

function drawCands(){
  gRoute.clearLayers();
  const best=bestCand();
  /* non-active first so the active one sits on top */
  cands.slice().sort(function(x,y){
    return (x.id===activeCand?1:0)-(y.id===activeCand?1:0);
  }).forEach(function(c){
    if(c.err||!c.legs.length) return;
    const geom=[].concat.apply([],c.legs);
    if(geom.length<2) return;
    const act=c.id===activeCand;
    if(act) L.polyline(geom,{color:c.color,weight:14,opacity:.16,interactive:false}).addTo(gRoute);
    if(best&&c.id===best.id&&cands.length>1)
      L.polyline(geom,{color:'#FFFFFF',weight:9,opacity:.14,interactive:false}).addTo(gRoute);
    L.polyline(geom,{color:c.color,weight:act?5:3,opacity:act?.95:.5,
                     dashArray:act?null:'1 7',lineCap:'round',interactive:false}).addTo(gRoute);
  });
  /* via handles, active candidate only */
  const c=curCand();
  if(c && mode==='route'){
    c.vias.forEach(function(v,i){
      const sel = selVia && selVia.candId===c.id && selVia.i===i;
      const m=L.marker(v,{
        icon:L.divIcon({className:'',html:'<div class="via'+(sel?' sel':'')+'"></div>',iconSize:[14,14],iconAnchor:[7,7]}),
        draggable:true, keyboard:false, zIndexOffset:500
      }).addTo(gRoute);
      m.on('click',function(ev){ L.DomEvent.stop(ev); selVia={candId:c.id,i:i}; drawCands(); candPanel(); });
      m.on('dragstart',function(){ save(); });
      m.on('drag',function(ev){
        c.vias[i]={lat:ev.latlng.lat,lng:ev.latlng.lng};
        const now=Date.now();
        if(now-lastDrag>70){ lastDrag=now; solveCand(c); strip(); candPanel(); }
      });
      m.on('dragend',function(){
        selVia={candId:c.id,i:i};
        solveCand(c); drawCands(); candPanel(); strip();
      });
    });
  }
}
let lastDrag=0;

function strip(){
  const s=document.getElementById('strip'), c=curCand(), best=bestCand();
  if(!c||c.len==null){
    document.getElementById('rlen').textContent='—';
    document.getElementById('rcap').textContent = c&&c.err ? c.err : (A&&B?'':(A?'finish not set':'not set'));
    s.classList.add('none'); return;
  }
  const f=fmt(c.len);
  document.getElementById('rlen').textContent=f[0]+' '+f[1];
  const d = best && best.id!==c.id
    ? fmtDelta(c.len-best.len)+' vs best'
    : (cands.length>1 ? 'shortest option'
       : c.vias.length ? c.vias.length+(c.vias.length===1?' via':' vias') : 'direct');
  document.getElementById('rcap').textContent='· '+d;
  s.classList.remove('none');
}

function candPanel(){
  const list=document.getElementById('clist');
  if(!list) return;
  if(!A||!B){ list.innerHTML='<div class="empty">Place a start and a finish</div>'; }
  else if(!cands.length){ list.innerHTML='<div class="empty">No options yet</div>'; }
  else{
    const best=bestCand();
    list.innerHTML='';
    cands.slice().sort(function(a,b){
      if(a.len==null) return 1; if(b.len==null) return -1; return a.len-b.len;
    }).forEach(function(c){
      const win = best && c.id===best.id && c.len!=null;
      const d=document.createElement('div');
      d.className='c'+(c.id===activeCand?' sel':'')+(win?' win':'')+(c.err?' err':'');
      const f=fmt(c.len);
      const delta = c.err ? '' : (win ? (cands.length>1?'<span class="bad">SHORTEST</span>':'')
                                     : fmtDelta(c.len-best.len));
      d.setAttribute('role','option');
      d.setAttribute('aria-selected',c.id===activeCand?'true':'false');
      d.tabIndex = c.id===activeCand ? 0 : -1;
      d.innerHTML='<span class="sw" style="background:'+c.color+'"></span>'+
        '<span class="nm">'+escapeHtml(c.name)+'</span>'+
        '<span class="len">'+(c.err?escapeHtml(c.err):f[0]+' '+f[1])+'</span>'+
        '<span class="dlt">'+delta+'</span>';
      const del=document.createElement('button');
      del.className='x'; del.type='button';
      del.setAttribute('aria-label','Delete option '+c.name);
      del.textContent='×';
      del.onclick=function(e){
        e.stopPropagation();
        save();
        cands=cands.filter(x=>x.id!==c.id);
        if(activeCand===c.id) activeCand=cands.length?cands[cands.length-1].id:null;
        selVia=null; drawCands(); candPanel(); strip();
      };
      d.appendChild(del);
      d.onclick=function(){ activeCand=c.id; selVia=null; drawCands(); candPanel(); strip(); };
      d.onkeydown=function(e){
        const rows=[].slice.call(list.querySelectorAll('.c[role=option]'));
        const i=rows.indexOf(d);
        if(e.key==='ArrowDown'||e.key==='ArrowUp'){
          e.preventDefault();
          const n=rows[i+(e.key==='ArrowDown'?1:-1)];
          if(n){ n.focus(); n.click(); }
        } else if(e.key==='Enter'||e.key===' '){ e.preventDefault(); d.click(); }
        else if(e.key==='F2'){ e.preventDefault(); const nm=prompt('Name this option',c.name); if(nm){ c.name=nm.slice(0,40); candPanel(); } }
        else if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); del.click(); }
      };
      d.querySelector('.nm').ondblclick=function(e){
        e.stopPropagation();
        const nm=prompt('Name this option',c.name);
        if(nm){ c.name=nm.slice(0,40); candPanel(); persist(); }
      };
      list.appendChild(d);
    });
  }
  const dv=document.getElementById('del-via');
  if(dv) dv.disabled=!selVia;
}

/* clicking the map in route mode adds a via to the active candidate, inserted
   at the leg it lands nearest so the route keeps its existing shape */
function addVia(ll){
  const c=curCand();
  if(!c){ toast('No option selected'); return; }
  let k=c.legs.length?c.legs.length-1:c.vias.length, bd=Infinity;
  c.legs.forEach(function(leg,li){
    for(let i=0;i<leg.length-1;i++){
      const r=projOn(ll,leg[i],leg[i+1]);
      if(r.d<bd){ bd=r.d; k=li; }
    }
  });
  const i=nearestGraphNode(ll);
  const g=G();
  const snap = i>=0 ? {lat:g.nodes[i].lat,lng:g.nodes[i].lng} : {lat:ll.lat,lng:ll.lng};
  save();
  c.vias.splice(k,0,snap);
  selVia={candId:c.id,i:k};
  solveCand(c); drawCands(); candPanel(); strip();
}

document.getElementById('set-a').onclick=function(){ pickNext='A'; toast('Click the map to place the start'); };
document.getElementById('set-b').onclick=function(){ pickNext='B'; toast('Click the map to place the finish'); };
document.getElementById('c-new').onclick=function(){
  if(!A||!B){ toast('Place a start and a finish first'); return; }
  save();
  const src=curCand();
  const c=newCand(src?src.vias:[], null);
  /* "Optimal variant variant variant" was the old result of copying a copy */
  if(src) c.name=(src.name.replace(/ \(\d+\)$/,''))+' ('+cands.length+')';
  selVia=null; solveCand(c); drawCands(); candPanel(); strip();
  toast('Drag a via, or click the map, to pull this option onto a different path');
};
document.getElementById('del-via').onclick=function(){
  if(!selVia) return;
  const c=cands.find(x=>x.id===selVia.candId); if(!c) return;
  save();
  c.vias.splice(selVia.i,1); selVia=null;
  solveCand(c); drawCands(); candPanel(); strip();
};
document.getElementById('clr-route').onclick=function(){ A=B=null; pickNext=null; clearRoute(); drawPins(); };

/* --------------------------------- input --------------------------------- */
map.on('click', function(ev){
  if(swallowClick){ swallowClick=false; return; }   /* end of a freehand drag */
  if(mode==='route'){
    const i=nearestGraphNode(ev.latlng);
    const g=G();
    const snap = i>=0 ? {lat:g.nodes[i].lat,lng:g.nodes[i].lng} : {lat:ev.latlng.lat,lng:ev.latlng.lng};
    userPlaced=true;   /* an endpoint moved because the user asked for it */
    if(pickNext==='A'){ A=snap; pickNext=null; drawPins(); clearRoute(); solveAll(); return; }
    if(pickNext==='B'){ B=snap; pickNext=null; drawPins(); clearRoute(); solveAll(); return; }
    if(!A){ A=snap; drawPins(); candPanel(); strip(); return; }
    if(!B){ B=snap; drawPins(); clearRoute(); solveAll(); return; }
    addVia(ev.latlng);
    return;
  }
  if(mode==='add') addPoint(ev.latlng);
  if(mode==='edit'){ selVert=null; render(); }
});

/* ------------------------- freehand drag-to-trace ------------------------- */
/* Perpendicular tolerance for thinning a freehand run, in metres. Deliberately
   tight: at 0.5 m a traced bend measures within a metre of the same bend laid
   down by dense clicking. If in doubt, keep more points, not fewer.
   Chords under-measure an arc by roughly tol/(3R) of its length, so 0.5 m on a
   20 m-radius bend loses about 0.8%; lower this constant, never raise it. */
const FREEHAND_SIMPLIFY_M=0.5;
const FREEHAND_MIN_STEP_M=0.15;   /* discard duplicate samples from a still cursor */
let fhRun=null, fhInk=null, swallowClick=false;

function fhLatLng(ev){ return map.mouseEventToLatLng(ev); }
function fhDown(ev){
  if(mode!=='add'||inputMode!=='free') return;
  if(ev.pointerType==='mouse'&&ev.button!==0) return;
  /* the zoom control and the vertex markers live inside the map container, and
     this is a raw DOM listener, so Leaflet's own propagation guards miss it */
  if(ev.target.closest&&ev.target.closest('.leaflet-control,.leaflet-marker-icon')) return;
  ev.preventDefault();
  const c=map.getContainer();
  map.dragging.disable();
  c.style.touchAction='none';
  if(c.setPointerCapture) try{ c.setPointerCapture(ev.pointerId); }catch(e){}
  fhRun=[fhLatLng(ev)];
  gHint.clearLayers();
  fhInk=L.polyline(fhRun,{color:'#FFFFFF',weight:3,opacity:.9,dashArray:'2 4',interactive:false}).addTo(gHint);
}
function fhMove(ev){
  if(!fhRun) return;
  ev.preventDefault();
  const ll=fhLatLng(ev);
  if(hav(fhRun[fhRun.length-1],ll)<FREEHAND_MIN_STEP_M) return;
  fhRun.push(ll);
  fhInk.setLatLngs(fhRun);
}
function fhUp(ev){
  if(!fhRun) return;
  const c=map.getContainer();
  if(c.releasePointerCapture&&ev.pointerId!=null) try{ c.releasePointerCapture(ev.pointerId); }catch(e){}
  c.style.touchAction='';
  map.dragging.enable();
  const run=fhRun; fhRun=null; fhInk=null; gHint.clearLayers();
  /* the browser fires a click after the release; drop that one, but never let
     the flag outlive the gesture */
  swallowClick=true;
  setTimeout(function(){ swallowClick=false; },400);
  if(run.length<2){ addPoint(run[0]); return; }   /* a tap is just a point */
  addRun(run);
}
(function bindFreehand(){
  const c=map.getContainer();
  c.addEventListener('pointerdown',fhDown);
  c.addEventListener('pointermove',fhMove);
  c.addEventListener('pointerup',fhUp);
  c.addEventListener('pointercancel',fhUp);
})();

/* ------------------------------ snap preview ------------------------------ */
/* Snapping is invisible until it surprises you, and a surprise fusion silently
   ruins a measurement. Show the radius, and the node that would be fused. */
let hoverT=0;
function clearHint(){ if(!fhRun) gHint.clearLayers(); }
map.on('mousemove',function(ev){
  if(mode!=='add'||fhRun){ return; }
  const now=Date.now();
  if(now-hoverT<50) return;
  hoverT=now;
  const r=snapM();
  gHint.clearLayers();
  L.circle(ev.latlng,{radius:r,color:'#FFC24B',weight:1,opacity:.55,dashArray:'3 4',
                      fillColor:'#FFC24B',fillOpacity:.06,interactive:false}).addTo(gHint);
  const v=nearestVertex(ev.latlng,r);
  if(v) L.circleMarker(v,{radius:8,color:'#FFC24B',weight:2,opacity:.95,
                          fillColor:'#FFC24B',fillOpacity:.35,interactive:false}).addTo(gHint);
});
map.on('mouseout',clearHint);
map.on('zoomend moveend',function(){ clearHint(); if(!fhRun){ render(); persist(); } });

const MODES={add:'m-add',edit:'m-edit',route:'m-route'};
const HINTS={
  add:'<b>Add points:</b> every click extends the active path, exactly where you clicked. Switch to <b>Freehand drag</b> to press and trace a curve in one go. Click the active line itself to insert a point mid-way, or <b>New path</b> to start a separate one. The dashed circle shows the junction tolerance: points inside it are treated as one junction <b>when routing</b>. Your line is never moved.',
  edit:'<b>Edit points:</b> drag any vertex to move it. Click one to select, then delete it or split the path there. Without a mouse: <kbd>[</kbd> and <kbd>]</kbd> step through the points, arrow keys nudge the selected one (<kbd>Shift</kbd> for ten steps), <kbd>Delete</kbd> removes it.',
  route:'<b>Route:</b> click for the start, click again for the finish — the app loads the street network around them if it needs to, then solves the shortest way. You do not have to draw anything first. Then <b>Variant</b> to copy it, and click or drag a <b>via</b> to pull that copy onto a different path. Every option is listed with its exact distance.'
};
function setMode(m){
  mode=m; pickNext=null; selVert=null;
  for(const k in MODES){
    const b=document.getElementById(MODES[k]);
    b.classList.toggle('on',k===m);
    b.setAttribute('aria-pressed',k===m?'true':'false');
  }
  document.getElementById('tag').textContent=({add:'ADD',edit:'EDIT',route:'ROUTE'})[m];
  document.getElementById('hint').innerHTML=HINTS[m];
  document.getElementById('tools-add').hidden=m!=='add';
  document.getElementById('tools-edit').hidden=m!=='edit';
  document.getElementById('tools-route').hidden=m!=='route';
  map.getContainer().classList.toggle('drawing',m!=='edit');
  selVia=null;
  render();
  if(A&&B) solveAll(); else { drawCands(); candPanel(); strip(); }
}
for(const k in MODES) document.getElementById(MODES[k]).onclick=(function(k){return function(){setMode(k);};})(k);

/* one helper so every toggle pair reports its state to assistive tech */
function setPair(onId,offId){
  const on=document.getElementById(onId), off=document.getElementById(offId);
  on.classList.add('on'); on.setAttribute('aria-pressed','true');
  off.classList.remove('on'); off.setAttribute('aria-pressed','false');
}
document.getElementById('end-end').onclick=function(){ appendTo='end'; setPair('end-end','end-start'); persist(); };
document.getElementById('end-start').onclick=function(){ appendTo='start'; setPair('end-start','end-end'); persist(); };

const panelEl=document.querySelector('.panel');
function setFolded(on){
  panelEl.classList.toggle('folded',!!on);
  const b=document.getElementById('fold');
  b.setAttribute('aria-expanded',on?'false':'true');
  b.setAttribute('aria-label',on?'Expand the panel':'Collapse the panel');
}
document.getElementById('fold').onclick=function(){ setFolded(!panelEl.classList.contains('folded')); };

/* ----------------------------- precision mode ----------------------------- */
function setPrecision(on){
  precision=!!on;
  setPair(precision?'pm-prec':'pm-net', precision?'pm-net':'pm-prec');
  const tag=document.getElementById('prec-tag');
  tag.textContent=precision?'PRECISION':'NETWORK';
  tag.classList.toggle('on',precision);
  snapEl.disabled=precision;
  document.getElementById('snap-out').textContent=precision
    ? PRECISION_SNAP_M+' m' : snapEl.value+' m';
  if(precision && document.getElementById('base').value!=='sat'){
    document.getElementById('base').value='sat'; setBase('sat');
  }
  /* mode change only alters how the graph is derived — paths and candidates
     are untouched, and every candidate re-solves against the new graph */
  dirty=true;
  if(A&&B) solveAll();
  persist();
}
document.getElementById('pm-net').onclick=function(){ setPrecision(false); };
document.getElementById('pm-prec').onclick=function(){ setPrecision(true); };

  save(); paths=[]; activeId=null; selVert=null; A=B=null;
  netTriedKey='';
